<title>Pixory</title>

<!--
  Pixory 3.0 — Telegram Mini App
  SECURITY:
  - CLIP text encoder runs entirely in this WebView (ADR-01)
  - Search queries never leave the device
  - Vectors stored in IndexedDB, sandboxed to this origin
  - CSP blocks all outbound connections during search
  - SRI on Transformers.js (update hash on version bump)

  OPEN SOURCE: AGPL v3 — https://github.com/pixory/pixory3
-->

<script type="module">
// ── Security: verify Telegram WebApp initData ─────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  // initData verification: send to our stateless worker for true/false only
  // ADR-08: bot token never client-side — worker returns verified: bool
  // For v1 MVP: skip server-side verification, accept Telegram context
  // TODO: add /verify endpoint on Cloudflare Worker before production
}


// ── Encryption (AES-256-GCM + PBKDF2) ────────────────────────────────────────
const ENCRYPT_MAGIC = "PIXENC1";

function isEncrypted(buffer) {
  if (buffer.byteLength < 7) return false;
  const header = new TextDecoder().decode(new Uint8Array(buffer, 0, 7));
  return header === ENCRYPT_MAGIC;
}

async function decryptVectors(encryptedBuffer, passphrase) {
  // Format: PIXENC1(7) + salt(16) + nonce(12) + ciphertext+tag(var)
  if (encryptedBuffer.byteLength < 7 + 16 + 12 + 16) {
    throw new Error("File too short to be a valid encrypted shard");
  }

  const salt       = new Uint8Array(encryptedBuffer,  7, 16);
  const nonce      = new Uint8Array(encryptedBuffer, 23, 12);
  const ciphertext = new Uint8Array(encryptedBuffer, 35);

  // Derive AES-256 key from passphrase (PBKDF2-HMAC-SHA256, 200K iterations)
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(passphrase),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 200_000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );

  // Decrypt — throws if passphrase wrong (GCM authentication failure)
  try {
    const plaintext = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: nonce },
      key,
      ciphertext
    );
    return plaintext;
  } catch {
    throw new Error("Wrong passphrase or corrupted file");
  }
}

// Show passphrase modal, return promise that resolves with passphrase
function askPassphrase(filename) {
  return new Promise((resolve, reject) => {
    // Create modal overlay
    const overlay = document.createElement("div");
    overlay.style.cssText = `
      position:fixed;inset:0;background:rgba(0,0,0,0.8);
      display:flex;align-items:center;justify-content:center;
      z-index:1000;padding:24px;
    `;

    overlay.innerHTML = `
      <div style="background:#161b22;border:1px solid #30363d;border-radius:16px;
                  padding:28px 24px;max-width:340px;width:100%;text-align:center;">
        <div style="font-size:28px;margin-bottom:12px;">🔒</div>
        <h3 style="margin-bottom:8px;font-size:17px;">Encrypted Index</h3>
        <p style="color:#8b949e;font-size:13px;margin-bottom:20px;line-height:1.5;">
          <strong>${filename}</strong> is encrypted.<br>
          Enter the passphrase you set when indexing.
        </p>
        <div style="background:#0d1117;border:1px solid #30363d;border-radius:8px;
                    padding:12px;margin-bottom:16px;text-align:left;">
          <div style="color:#e67e22;font-size:12px;margin-bottom:6px;">⚠️ Remember your passphrase</div>
          <div style="color:#8b949e;font-size:11px;line-height:1.5;">
            Without it you cannot import this index<br>on another device or after reinstall.
          </div>
        </div>
        <input id="pp-input" type="password" placeholder="Passphrase"
          style="width:100%;background:#0d1117;border:1px solid #30363d;
                 border-radius:8px;padding:12px;color:#e6edf3;font-size:15px;
                 outline:none;margin-bottom:8px;" />
        <div id="pp-error" style="color:#f85149;font-size:12px;
             min-height:16px;margin-bottom:8px;"></div>
        <button id="pp-ok" style="width:100%;background:#238636;color:white;
          border:none;border-radius:10px;padding:14px;font-size:15px;
          font-weight:600;cursor:pointer;margin-bottom:8px;">
          Unlock
        </button>
        <button id="pp-cancel" style="width:100%;background:transparent;
          color:#8b949e;border:1px solid #30363d;border-radius:10px;
          padding:10px;font-size:13px;cursor:pointer;">
          Cancel
        </button>
      </div>
    `;

    document.body.appendChild(overlay);

    const input  = overlay.querySelector("#pp-input");
    const errEl  = overlay.querySelector("#pp-error");
    const okBtn  = overlay.querySelector("#pp-ok");
    const cancel = overlay.querySelector("#pp-cancel");

    input.focus();

    function attempt() {
      const val = input.value.trim();
      if (!val) { errEl.textContent = "Enter passphrase"; return; }
      overlay.remove();
      resolve(val);
    }

    okBtn.addEventListener("click", attempt);
    cancel.addEventListener("click", () => {
      overlay.remove();
      reject(new Error("Cancelled"));
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") attempt();
      errEl.textContent = "";
    });

    // Allow retrying with error feedback (called from import flow)
    overlay._setError = msg => { errEl.textContent = msg; input.value = ""; input.focus(); };
  });
}

// ── IndexedDB ────────────────────────────────────────────────────────────────
const DB_NAME    = "pixory3";
const DB_VERSION = 1;
const STORE      = "vectors";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
        store.createIndex("path", "path", { unique: true });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function countVectors(db) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).count();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e => reject(e.target.error);
  });
}


// ── Serve token (for serve.py authenticated requests) ──────────────────────
async function getServeToken() {
  try {
    const tx    = db.transaction('settings', 'readonly');
    const store = tx.objectStore('settings');
    return await new Promise(r => {
      const req  = store.get('serve_token');
      req.onsuccess = () => r(req.result || '');
      req.onerror   = () => r('');
    });
  } catch { return ''; }
}

async function setServeToken(token) {
  try {
    const tx = db.transaction('settings', 'readwrite');
    tx.objectStore('settings').put(token.trim(), 'serve_token');
    await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
  } catch {}
}

// Build URL for serve.py with token (null if no token configured)
function serveUrl(relPath, token) {
  if (!token) return null;
  return `http://127.0.0.1:8765/${relPath}?token=${encodeURIComponent(token)}`;
}

async function getAllVectors(db) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e => reject(e.target.error);
  });
}

// appendToStore: ADD records without clearing existing ones
// Used for multi-shard import (each shard appends)
async function appendToStore(db, records) {
  return new Promise((resolve, reject) => {
    const tx    = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    let i = 0;
    function next() {
      if (i >= records.length) { resolve(); return; }
      const req = store.add(records[i++]);
      req.onsuccess = next;
      req.onerror   = e => reject(e.target.error);
    }
    next();
    tx.onerror = e => reject(e.target.error);
  });
}

// clearAndStore: REPLACE all records (used for full re-import)
async function clearAndStore(db, records) {
  return new Promise((resolve, reject) => {
    const tx    = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    store.clear().onsuccess = () => {
      let i = 0;
      function next() {
        if (i >= records.length) { resolve(); return; }
        const req = store.add(records[i++]);
        req.onsuccess = next;
        req.onerror   = e => reject(e.target.error);
      }
      next();
    };
    tx.onerror = e => reject(e.target.error);
  });
}

// ── vectors.bin parser ────────────────────────────────────────────────────────
function parseVectorsBin(buffer) {
  const view   = new DataView(buffer);
  const magic  = String.fromCharCode(...new Uint8Array(buffer, 0, 4));
  if (magic !== "PXRY") throw new Error("Invalid file: not a Pixory vectors.bin");

  const version = view.getUint8(4);
  const dim     = view.getUint16(5, true);
  const count   = view.getUint32(7, true);

  if (dim !== 512) throw new Error(`Unsupported dimension: ${dim}`);

  // v3: Int8 quantized, shards with country/city/phash (32-byte header)
  if (version === 3) return _parseV3(buffer, view, dim, count);
  // v1/v2: float32 legacy format
  if (version !== 1 && version !== 2) throw new Error(`Unsupported version: ${version}`);

  const records = [];
  let offset = 16; // header size
  const dec  = new TextDecoder("utf-8");

  for (let i = 0; i < count; i++) {
    // Vector: 512 × float32 = 2048 bytes
    // Use buffer.slice() to create aligned copy — Float32Array requires
    // offset to be a multiple of 4, which variable-length paths break.
    const slice  = buffer.slice(offset, offset + dim * 4);
    const vector = new Float32Array(slice);
    offset += dim * 4;

    // Timestamp: uint32
    const ts = view.getUint32(offset, true);
    offset += 4;

    // Path: uint16 length + bytes
    const plen = view.getUint16(offset, true);
    offset += 2;
    const path = dec.decode(new Uint8Array(buffer, offset, plen));
    offset += plen;

    // Thumbnail: uint32 length + JPEG bytes (0 = no thumbnail)
    const tlen = view.getUint32(offset, true);
    offset += 4;
    let thumbDataUrl = "";
    if (tlen > 0) {
      const jpegBytes = new Uint8Array(buffer, offset, tlen);
      // Convert JPEG bytes to base64 data URL
      let binary = "";
      for (let j = 0; j < jpegBytes.length; j++) {
        binary += String.fromCharCode(jpegBytes[j]);
      }
      thumbDataUrl = "data:image/jpeg;base64," + btoa(binary);
      offset += tlen;
    }

    records.push({
      vector: Array.from(vector),
      ts,
      path,
      date:         ts ? new Date(ts * 1000).toISOString().slice(0, 10) : "",
      thumbDataUrl,
    });
  }

  return { count, records };
}

// ── CLIP text encoder via Transformers.js ─────────────────────────────────────
// Loaded from CDN with SRI (update hash when upgrading version)
let clipTokenizer = null;
let clipTextModel  = null;


// ── v3 parser (Int8 quantized, shards) ──────────────────────────────────────
// Security: validates magic, version, dimension before parsing any data
// Unhappy paths: corrupt file → throws (caught by caller → shows error)
function _parseV3(buffer, view, dim, count) {
  // Header: 32 bytes total
  // [0:4] magic, [4] version, [5:7] dim, [7:11] count,
  // [11:13] year, [13] quant, [14:32] reserved
  const quant = view.getUint8(13);
  if (quant !== 1) throw new Error(`Unsupported quantization: ${quant}`);

  const records = [];
  let offset = 32; // skip 32-byte header

  for (let i = 0; i < count; i++) {
    if (offset + 512 > buffer.byteLength)
      throw new Error(`Truncated file at record ${i}`);

    // Int8 vector (512 bytes) → dequantize to float32
    const raw = new Int8Array(buffer, offset, 512);
    const vector = new Float32Array(512);
    for (let j = 0; j < 512; j++) vector[j] = raw[j] / 127.0;
    offset += 512;

    // ts (uint32), cc (uint16), clen (uint8)
    const ts   = view.getUint32(offset, true);     offset += 4;
    const cc   = view.getUint16(offset, true);     offset += 2;
    const clen = view.getUint8(offset);            offset += 1;

    // city (UTF-8, clen bytes)
    const city = clen > 0
      ? new TextDecoder().decode(new Uint8Array(buffer, offset, clen))
      : "";
    offset += clen;

    // phash (uint64 as two uint32 — JS can't do BigInt64 in all contexts)
    const phLo = view.getUint32(offset, true);
    const phHi = view.getUint32(offset + 4, true);
    offset += 8;

    // path
    const plen = view.getUint16(offset, true);     offset += 2;
    const path = new TextDecoder().decode(new Uint8Array(buffer, offset, plen));
    offset += plen;

    // thumbnail
    const tlen = view.getUint32(offset, true);     offset += 4;
    let thumbDataUrl = "";
    if (tlen > 0) {
      const jpegBytes = new Uint8Array(buffer, offset, tlen);
      let bin = "";
      for (let k = 0; k < jpegBytes.length; k++) bin += String.fromCharCode(jpegBytes[k]);
      thumbDataUrl = "data:image/jpeg;base64," + btoa(bin);
      offset += tlen;
    }

    const name = path.split(/[\/]/).pop() || path;
    const date = ts ? new Date(ts * 1000).toISOString().slice(0, 10) : "";
    
    records.push({ vector, ts, path, date, name, cc, city, thumbDataUrl });
  }
  return records;
}

async function loadCLIP() {
  // Note: WKWebView (Telegram/iOS) can freeze DOM during WASM compilation.
  // We show a static message with clear expectation rather than a timer
  // that may appear frozen.
  setLoading(
    "Loading AI model…\n\n" +
    "⏳ First launch takes 30–90 seconds.\n" +
    "Screen may look frozen — this is normal.\n" +
    "Subsequent launches are instant (cached)."
  );

  try {
    const { AutoTokenizer, CLIPTextModelWithProjection } = await import(
      "https://cdn.jsdelivr.net/npm/@xenova/transformers@2/dist/transformers.min.js"
    );
    [clipTokenizer, clipTextModel] = await Promise.all([
      AutoTokenizer.from_pretrained("Xenova/clip-vit-base-patch32"),
      CLIPTextModelWithProjection.from_pretrained("Xenova/clip-vit-base-patch32"),
    ]);
    setLoading("AI model ready ✓");
  } catch (err) {
    throw new Error("Model load failed: " + err.message);
  }
}

async function textEmbed(query) {
  const inputs = clipTokenizer([query], { padding: true, truncation: true });
  const { text_embeds } = await clipTextModel(inputs);
  // L2-normalize to match open_clip image embeddings
  const vec  = text_embeds.data;
  const norm = Math.sqrt(Array.from(vec).reduce((s, v) => s + v * v, 0));
  return Float32Array.from(vec, v => v / norm);
}

// ── Thumbnail resolution ─────────────────────────────────────────────────────────
// Priority: 1) embedded in vectors.bin (works everywhere, offline)
//           2) localhost serve.py (works when PC is on, home WiFi)

const IS_LOCAL = location.hostname === '127.0.0.1' || location.hostname === 'localhost';

let _serveToken = '';

async function loadServeToken() {
  _serveToken = await getServeToken();
}

function getThumbSrc(result) {
  // Priority 1: embedded (IndexedDB, works offline everywhere)
  if (result.thumbDataUrl) return result.thumbDataUrl;
  // Priority 2: serve.py with token (home WiFi, PC on)
  if (_serveToken) {
    const safe = result.path.replace(/[^a-zA-Z0-9._-]/g, '_').substring(0, 120);
    return serveUrl(`thumbs/${safe}.jpg`, _serveToken);
  }
  // Fallback: unauthenticated localhost (backward compat, no token set yet)
  if (IS_LOCAL) {
    const safe = result.path.replace(/[^a-zA-Z0-9._-]/g, '_').substring(0, 120);
    return `http://127.0.0.1:8765/thumbs/${safe}.jpg`;
  }
  return null;
}

// ── Cosine similarity (batch, optimised) ─────────────────────────────────────
function cosineSimilarity(a, b) {
  // Both assumed L2-normalized (CLIP outputs are normalized)
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return dot;
}

const SCORE_CUTOFF = 0.20;  // CLIP cosine sims typically 0.20-0.35 for good matches

function topK(queryVec, vectors, paths, dates, k = 20) {
  const scores = vectors
    .map((v, i) => ({
      score: cosineSimilarity(queryVec, v),
      path:  paths[i],
      date:  dates[i],
      i,
    }))
    .filter(r => r.score >= SCORE_CUTOFF);
  scores.sort((a, b) => b.score - a.score);
  return scores.slice(0, k);
}

// ── State management ──────────────────────────────────────────────────────────
function setState(id) {
  ["state-loading","state-import","state-ready","state-error"]
    .forEach(s => document.getElementById(s).classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function setLoading(msg) {
  document.getElementById("loading-msg").innerHTML =
    msg.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\n/g,"<br>");
  setState("state-loading");
}

function showError(msg) {
  document.getElementById("error-msg").textContent = msg;
  setState("state-error");
}

function showImport() {
  setState("state-import");
}

// ── App init ──────────────────────────────────────────────────────────────────
let db;
let cachedVecs   = null; // Array of Float32Array
let cachedPaths  = null;
let cachedDates  = null;
let cachedThumbs = null;

async function init() {
  try {
    setLoading("Step 1: Opening local storage…");
    db = await openDB();
    await loadServeToken();  // token for serve.py requests
    setLoading("Step 2: Loading AI model…");
    await loadCLIP();

    const count = await countVectors(db);
    if (count === 0) {
      setState("state-import");
      return;
    }

    setLoading(`Loading ${count} vectors from storage…`);
    await loadVectorsFromDB();
    setState("state-ready");
    document.getElementById("status-bar").textContent =
      `${count} photos indexed — try "beach sunset" or "family dinner"`;
  } catch (err) {
    const detail = `${err.name}: ${err.message}`;
    showError(`Step failed: ${detail}`);
  }
}

async function loadVectorsFromDB() {
  const rows     = await getAllVectors(db);
  cachedVecs     = rows.map(r => new Float32Array(r.vector));
  cachedPaths    = rows.map(r => r.path);
  cachedDates    = rows.map(r => r.date || "");
  cachedThumbs   = rows.map(r => r.thumbDataUrl || "");
}


// ── File import ───────────────────────────────────────────────────────────────
// Bind Re-import button via event listener (more reliable than onclick in WebView)
document.getElementById("btn-reimport").addEventListener("click", function() {
  setState("state-import");
});

document.getElementById("file-input").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  setLoading("Reading file…");
  try {
    let buf = await file.arrayBuffer();

    // ── Encrypted shard: prompt for passphrase ────────────────────────────
    if (isEncrypted(buf)) {
      setLoading("Encrypted index detected…");
      let decrypted = null;
      while (!decrypted) {
        let passphrase;
        try {
          passphrase = await askPassphrase(file.name);
        } catch {
          // User cancelled
          setState("state-import");
          return;
        }
        setLoading("Decrypting… (this takes a few seconds)");
        try {
          decrypted = await decryptVectors(buf, passphrase);
        } catch (decErr) {
          // Wrong passphrase — show error inline in modal (re-prompt)
          // Since modal is gone, show error and re-ask
          setLoading("Wrong passphrase. Try again…");
          await new Promise(r => setTimeout(r, 800));
          // Loop continues → askPassphrase again
        }
      }
      buf = decrypted;
    }

    // ── Parse (v1/v2/v3) ─────────────────────────────────────────────────
    setLoading("Parsing index…");
    const records = parseVectorsBin(buf);
    const count   = records.length;

    setLoading("Storing " + count + " vectors…");
    await clearAndStore(db, records);
    await loadVectorsFromDB();
    const total = cachedVecs ? cachedVecs.length : count;

    setState("state-ready");
    document.getElementById("status-bar").textContent =
      total + " photos indexed. Try \"sunset\" or \"birthday party\".";
  } catch (err) {
    showError("Import failed: " + err.message);
  }
});

// ── Search ────────────────────────────────────────────────────────────────────
const searchInput = document.getElementById("search-input");
const grid        = document.getElementById("results-grid");
const statusBar   = document.getElementById("status-bar");

let searchTimer = null;

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) {
    grid.innerHTML = "";
    statusBar.textContent = `${cachedVecs?.length ?? 0} photos indexed`;
    return;
  }
  searchTimer = setTimeout(() => runSearch(q), 300); // debounce 300ms
});

async function runSearch(query) {
  if (!cachedVecs || !clipTextModel) return;
  statusBar.textContent = "Searching…";

  try {
    const t0  = performance.now();
    const qv  = await textEmbed(query);
    const top = topK(qv, cachedVecs, cachedPaths, cachedDates, 20);
    const ms  = Math.round(performance.now() - t0);

    // Debug: show top raw scores in console (remove after calibration)
    const rawTop = cachedVecs
      .map((v, i) => ({ s: cosineSimilarity(qv, v), p: cachedPaths[i] }))
      .sort((a, b) => b.s - a.s).slice(0, 5);
    console.log(`[Pixory] Top scores for "${query}":`,
      rawTop.map(r => `${(r.s*100).toFixed(1)}% ${r.p.split(/[\/]/).pop()}`));

    renderResults(top, query);
    statusBar.textContent =
      `${top.length} results for "${query}" — ${ms}ms`;
  } catch (err) {
    statusBar.textContent = `Search error: ${err.message}`;
  }
}

function renderResults(results, query) {
  grid.innerHTML = "";
  if (results.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      No photos found for "${query}"</div>`;
    return;
  }

  results.forEach(r => {
    const item  = document.createElement("div");
    item.className = "result-item";
    const name = r.path.split(/[\/]/).pop();
    const url  = getThumbSrc(r);

    const imgHtml = url
      ? `<img src="${url}" alt="${name}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
              style="width:100%;height:100%;object-fit:cover;display:block">
         <div style="display:none;width:100%;height:100%;align-items:center;
                     justify-content:center;background:#161b22;font-size:10px;
                     color:#555;padding:4px;text-align:center;word-break:break-all">${name}</div>`
      : `<div style="width:100%;height:100%;display:flex;flex-direction:column;
                     align-items:center;justify-content:center;background:#161b22;
                     padding:6px;gap:4px">
           <div style="font-size:18px">🖼</div>
           <div style="font-size:9px;color:#555;text-align:center;word-break:break-all">${name}</div>
         </div>`;
    item.innerHTML = `
      ${imgHtml}
      <span class="score">${(r.score * 100).toFixed(0)}%</span>
      <span class="date">${r.date}</span>
    `;

    // Click: lightbox (local) or show path (mobile)
    item.addEventListener("click", () => {
      if (url) {
        const lb = document.getElementById("lightbox");
        document.getElementById("lightbox-img").src  = url;
        document.getElementById("lightbox-name").textContent = r.path;
        lb.style.display = "flex";
      } else if (tg) {
        tg.showPopup({ title: "File", message: r.path,
                       buttons: [{ type: "close" }] });
      }
    });

    grid.appendChild(item);
  });
}

// ── Start ─────────────────────────────────────────────────────────────────────

// Detect file:// protocol — fetch won't work, show clear instruction
if (location.protocol === 'file:') {
  document.getElementById('loading-msg').textContent =
    '⚠️ Open via http://localhost, not file://';
  document.querySelector('.loading-text + div').innerHTML =
    '<div style="color:#e67e22;font-size:13px;max-width:280px;line-height:1.6">' +
    'In terminal:<br><code style="background:#21262d;padding:4px 8px;border-radius:4px">' +
    'python -m http.server 8765</code><br><br>' +
    'Then open:<br><code style="background:#21262d;padding:4px 8px;border-radius:4px">' +
    'http://localhost:8765/app.html</code></div>';
} else {
  init();
}
</script>
