<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pixory</title>

<!--
  Pixory 3.0 — Telegram Mini App
  SECURITY:
  - CLIP text encoder runs entirely in this WebView (ADR-01)
  - Search queries never leave the device
  - Vectors stored in IndexedDB, sandboxed to this origin
  - CSP blocks all outbound connections during search
  - SRI on Transformers.js (update hash on version bump)

  OPEN SOURCE: AGPL v3 — https://github.com/pixory/pixory3
-->

<!-- CSP disabled for MVP testing — re-enable before production -->

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--tg-theme-bg-color, #0d1117);
  color: var(--tg-theme-text-color, #e6edf3);
  min-height: 100vh;
}

/* ── States ── */
#state-loading, #state-import, #state-ready, #state-error {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  text-align: center;
  gap: 16px;
}
.active { display: flex !important; }

/* ── Loading ── */
.spinner {
  width: 40px; height: 40px;
  border: 3px solid #30363d;
  border-top-color: #58a6ff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: #8b949e; font-size: 14px; }

/* ── Import ── */
.import-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 14px;
  padding: 28px 24px;
  max-width: 340px;
  width: 100%;
}
.import-card h2 { font-size: 18px; margin-bottom: 8px; }
.import-card p  { color: #8b949e; font-size: 13px; line-height: 1.5; }
.import-steps   { text-align: left; margin: 16px 0; }
.import-steps li { color: #8b949e; font-size: 12px; margin: 6px 0 6px 16px; }
.btn-primary {
  display: block; width: 100%;
  background: #238636; color: white;
  border: none; border-radius: 10px;
  padding: 14px; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 16px;
}
.btn-primary:hover { background: #2ea043; }
#file-input { display: none; }

/* ── Search ── */
#state-ready { justify-content: flex-start; padding: 0; }
.search-bar {
  position: sticky; top: 0; z-index: 10;
  background: var(--tg-theme-bg-color, #0d1117);
  padding: 12px 16px;
  border-bottom: 1px solid #21262d;
  display: flex; gap: 8px; align-items: center;
}
.search-input {
  flex: 1;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  color: #e6edf3;
  font-size: 15px;
  padding: 10px 14px;
  outline: none;
}
.search-input:focus { border-color: #58a6ff; }
.search-input::placeholder { color: #555; }
.status-bar {
  padding: 6px 16px;
  font-size: 11px;
  color: #555;
  min-height: 24px;
}
.results-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  padding: 0 0 80px;
}
.result-item {
  aspect-ratio: 1;
  background: #161b22;
  overflow: hidden;
  cursor: pointer;
  position: relative;
}
.result-item img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.result-item .score {
  position: absolute; bottom: 4px; right: 4px;
  background: rgba(0,0,0,0.6);
  color: white; font-size: 9px;
  padding: 2px 5px; border-radius: 4px;
}
.result-item .date {
  position: absolute; bottom: 4px; left: 4px;
  background: rgba(0,0,0,0.6);
  color: #ccc; font-size: 9px;
  padding: 2px 5px; border-radius: 4px;
}
.empty { color: #555; font-size: 14px; text-align: center; padding: 48px 16px; }
.import-btn-small {
  position: fixed; bottom: 20px; right: 16px;
  background: #21262d; color: #8b949e;
  border: 1px solid #30363d; border-radius: 20px;
  padding: 8px 14px; font-size: 12px; cursor: pointer;
}
</style>
</head>
<body>

<!-- STATE: Loading model -->
<div id="state-loading" class="active">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-msg">Loading AI model…</div>
  <div style="color:#555;font-size:11px">First launch: ~65MB download, cached forever</div>
</div>

<!-- Lightbox overlay -->
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);
     z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px"
     onclick="this.style.display='none'">
  <img id="lightbox-img" style="max-width:95vw;max-height:80vh;border-radius:8px;object-fit:contain">
  <div id="lightbox-name" style="color:#8b949e;font-size:12px;max-width:90vw;
       text-align:center;word-break:break-all"></div>
</div>

<!-- STATE: Import vectors.bin -->
<div id="state-import">
  <div class="import-card">
    <h2>📁 Import your library</h2>
    <p>Your photo index was not found.<br>Generate it on your PC first.</p>
    <ol class="import-steps">
      <li>On PC: run <code>python indexer.py --photos /your/photos</code></li>
      <li>Copy <code>vectors.bin</code> to your phone</li>
      <li>Tap Import below</li>
    </ol>
    <input type="file" id="file-input" accept=".bin">
    <button class="btn-primary" onclick="document.getElementById('file-input').click()">
      Import vectors.bin
    </button>
  </div>
</div>

<!-- STATE: Search ready -->
<div id="state-ready">
  <div class="search-bar">
    <input class="search-input" id="search-input"
           type="search" placeholder="Search your photos…"
           autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="status-bar" id="status-bar"></div>
  <div class="results-grid" id="results-grid"></div>
  <button class="import-btn-small" onclick="showImport()">↻ Re-import</button>
</div>

<!-- STATE: Error -->
<div id="state-error">
  <div style="font-size:40px">⚠️</div>
  <div id="error-msg" style="color:#e67e22;font-size:14px;max-width:280px"></div>
  <button class="btn-primary" style="max-width:200px" onclick="location.reload()">Retry</button>
</div>

<script type="module">
// ── Security: verify Telegram WebApp initData ─────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  // initData verification: send to our stateless worker for true/false only
  // ADR-08: bot token never client-side — worker returns verified: bool
  // For v1 MVP: skip server-side verification, accept Telegram context
  // TODO: add /verify endpoint on Cloudflare Worker before production
}

// ── IndexedDB ────────────────────────────────────────────────────────────────
const DB_NAME    = "pixory3";
const DB_VERSION = 1;
const STORE      = "vectors";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
        store.createIndex("path", "path", { unique: true });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function countVectors(db) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).count();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function getAllVectors(db) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function clearAndStore(db, records) {
  return new Promise((resolve, reject) => {
    const tx    = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    store.clear().onsuccess = () => {
      let i = 0;
      function next() {
        if (i >= records.length) { resolve(); return; }
        const req = store.add(records[i++]);
        req.onsuccess = next;
        req.onerror   = e => reject(e.target.error);
      }
      next();
    };
    tx.onerror = e => reject(e.target.error);
  });
}

// ── vectors.bin parser ────────────────────────────────────────────────────────
function parseVectorsBin(buffer) {
  const view   = new DataView(buffer);
  const magic  = String.fromCharCode(...new Uint8Array(buffer, 0, 4));
  if (magic !== "PXRY") throw new Error("Invalid file: not a Pixory vectors.bin");

  const version = view.getUint8(4);
  const dim     = view.getUint16(5, true);
  const count   = view.getUint32(7, true);

  if (version !== 1)   throw new Error(`Unsupported version: ${version}`);
  if (dim !== 512)     throw new Error(`Unsupported dimension: ${dim}`);

  const records = [];
  let offset = 16; // header size
  const dec  = new TextDecoder("utf-8");

  for (let i = 0; i < count; i++) {
    // Vector: 512 × float32 = 2048 bytes
    // Use buffer.slice() to create aligned copy — Float32Array requires
    // offset to be a multiple of 4, which variable-length paths break.
    const slice  = buffer.slice(offset, offset + dim * 4);
    const vector = new Float32Array(slice);
    offset += dim * 4;

    // Timestamp: uint32
    const ts = view.getUint32(offset, true);
    offset += 4;

    // Path: uint16 length + bytes
    const plen = view.getUint16(offset, true);
    offset += 2;
    const path = dec.decode(new Uint8Array(buffer, offset, plen));
    offset += plen;

    records.push({
      vector: Array.from(vector),
      ts,
      path,
      date: ts ? new Date(ts * 1000).toISOString().slice(0, 10) : "",
    });
  }

  return { count, records };
}

// ── CLIP text encoder via Transformers.js ─────────────────────────────────────
// Loaded from CDN with SRI (update hash when upgrading version)
let clipTokenizer = null;
let clipTextModel  = null;

async function loadCLIP() {
  console.log('[Pixory] Starting Transformers.js load...');
  setLoading("Downloading AI model… (~80 MB, cached forever)");
  const { AutoTokenizer, CLIPTextModelWithProjection } = await import(
    "https://cdn.jsdelivr.net/npm/@xenova/transformers@2/dist/transformers.min.js"
  );
  console.log('[Pixory] Downloading CLIP text encoder from HuggingFace...');
  [clipTokenizer, clipTextModel] = await Promise.all([
    AutoTokenizer.from_pretrained("Xenova/clip-vit-base-patch32"),
    CLIPTextModelWithProjection.from_pretrained("Xenova/clip-vit-base-patch32"),
  ]);
  console.log('[Pixory] CLIP text encoder ready');
  setLoading("Model ready.");
}

async function textEmbed(query) {
  const inputs = clipTokenizer([query], { padding: true, truncation: true });
  const { text_embeds } = await clipTextModel(inputs);
  // L2-normalize to match open_clip image embeddings
  const vec  = text_embeds.data;
  const norm = Math.sqrt(Array.from(vec).reduce((s, v) => s + v * v, 0));
  return Float32Array.from(vec, v => v / norm);
}

// ── Thumbnail URL ────────────────────────────────────────────────────────────────
function thumbUrl(relPath) {
  // Must match _thumb_name() in indexer.py
  const safe = relPath.replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 120);
  return `http://localhost:8765/thumbs/${safe}.jpg`;
}

// ── Cosine similarity (batch, optimised) ─────────────────────────────────────
function cosineSimilarity(a, b) {
  // Both assumed L2-normalized (CLIP outputs are normalized)
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return dot;
}

const SCORE_CUTOFF = 0.20;  // CLIP cosine sims typically 0.20-0.35 for good matches

function topK(queryVec, vectors, paths, dates, k = 20) {
  const scores = vectors
    .map((v, i) => ({
      score: cosineSimilarity(queryVec, v),
      path:  paths[i],
      date:  dates[i],
      i,
    }))
    .filter(r => r.score >= SCORE_CUTOFF);
  scores.sort((a, b) => b.score - a.score);
  return scores.slice(0, k);
}

// ── State management ──────────────────────────────────────────────────────────
function setState(id) {
  ["state-loading","state-import","state-ready","state-error"]
    .forEach(s => document.getElementById(s).classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function setLoading(msg) {
  document.getElementById("loading-msg").textContent = msg;
  setState("state-loading");
}

function showError(msg) {
  document.getElementById("error-msg").textContent = msg;
  setState("state-error");
}

function showImport() { setState("state-import"); }

// ── App init ──────────────────────────────────────────────────────────────────
let db;
let cachedVecs   = null; // Array of Float32Array
let cachedPaths  = null;
let cachedDates  = null;

async function init() {
  try {
    db = await openDB();
    await loadCLIP();

    const count = await countVectors(db);
    if (count === 0) {
      setState("state-import");
      return;
    }

    setLoading(`Loading ${count} vectors from storage…`);
    await loadVectorsFromDB();
    setState("state-ready");
    document.getElementById("status-bar").textContent =
      `${count} photos indexed — try "beach sunset" or "family dinner"`;
  } catch (err) {
    showError(`Error: ${err.message}\n\nCheck F12 → Console for details.\n\nCommon fix: disable VPN or try a different browser.`);
  }
}

async function loadVectorsFromDB() {
  const rows    = await getAllVectors(db);
  cachedVecs    = rows.map(r => new Float32Array(r.vector));
  cachedPaths   = rows.map(r => r.path);
  cachedDates   = rows.map(r => r.date || "");
}

// ── File import ───────────────────────────────────────────────────────────────
document.getElementById("file-input").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  setLoading("Parsing vectors.bin…");
  try {
    const buf = await file.arrayBuffer();
    const { count, records } = parseVectorsBin(buf);

    setLoading(`Storing ${count} vectors locally…`);
    await clearAndStore(db, records);
    await loadVectorsFromDB();

    setState("state-ready");
    document.getElementById("status-bar").textContent =
      `${count} photos indexed. Try "sunset" or "birthday party".`;
  } catch (err) {
    showError(`Import failed: ${err.message}`);
  }
});

// ── Search ────────────────────────────────────────────────────────────────────
const searchInput = document.getElementById("search-input");
const grid        = document.getElementById("results-grid");
const statusBar   = document.getElementById("status-bar");

let searchTimer = null;

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) {
    grid.innerHTML = "";
    statusBar.textContent = `${cachedVecs?.length ?? 0} photos indexed`;
    return;
  }
  searchTimer = setTimeout(() => runSearch(q), 300); // debounce 300ms
});

async function runSearch(query) {
  if (!cachedVecs || !clipTextModel) return;
  statusBar.textContent = "Searching…";

  try {
    const t0  = performance.now();
    const qv  = await textEmbed(query);
    const top = topK(qv, cachedVecs, cachedPaths, cachedDates, 20);
    const ms  = Math.round(performance.now() - t0);

    // Debug: show top raw scores in console (remove after calibration)
    const rawTop = cachedVecs
      .map((v, i) => ({ s: cosineSimilarity(qv, v), p: cachedPaths[i] }))
      .sort((a, b) => b.s - a.s).slice(0, 5);
    console.log(`[Pixory] Top scores for "${query}":`,
      rawTop.map(r => `${(r.s*100).toFixed(1)}% ${r.p.split(/[\/]/).pop()}`));

    renderResults(top, query);
    statusBar.textContent =
      `${top.length} results for "${query}" — ${ms}ms`;
  } catch (err) {
    statusBar.textContent = `Search error: ${err.message}`;
  }
}

function renderResults(results, query) {
  grid.innerHTML = "";
  if (results.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      No photos found for "${query}"</div>`;
    return;
  }

  results.forEach(r => {
    const item  = document.createElement("div");
    item.className = "result-item";
    const name = r.path.split(/[\/]/).pop();
    const url  = thumbUrl(r.path);

    item.innerHTML = `
      <img src="${url}" alt="${name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
           style="width:100%;height:100%;object-fit:cover;display:block">
      <div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;
                  background:#161b22;font-size:10px;color:#555;padding:4px;text-align:center;
                  word-break:break-all">${name}</div>
      <span class="score">${(r.score * 100).toFixed(0)}%</span>
      <span class="date">${r.date}</span>
    `;

    // Click: lightbox
    item.addEventListener("click", () => {
      const lb = document.getElementById("lightbox");
      document.getElementById("lightbox-img").src  = url;
      document.getElementById("lightbox-name").textContent = r.path;
      lb.style.display = "flex";
    });

    grid.appendChild(item);
  });
}

// ── Start ─────────────────────────────────────────────────────────────────────

// Detect file:// protocol — fetch won't work, show clear instruction
if (location.protocol === 'file:') {
  document.getElementById('loading-msg').textContent =
    '⚠️ Open via http://localhost, not file://';
  document.querySelector('.loading-text + div').innerHTML =
    '<div style="color:#e67e22;font-size:13px;max-width:280px;line-height:1.6">' +
    'In terminal:<br><code style="background:#21262d;padding:4px 8px;border-radius:4px">' +
    'python -m http.server 8765</code><br><br>' +
    'Then open:<br><code style="background:#21262d;padding:4px 8px;border-radius:4px">' +
    'http://localhost:8765/app.html</code></div>';
} else {
  init();
}
</script>
</body>
</html>
