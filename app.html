<!--
  Pixory 3.0 — Telegram Mini App
  SECURITY:
  - CLIP text encoder runs entirely in this WebView (ADR-01)
  - Search queries never leave the device
  - Vectors stored in IndexedDB, sandboxed to this origin

<script>
// Global error handlers removed

// ── Security: verify Telegram WebApp initData ─────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  // initData verification: send to our stateless worker for true/false only
  // ADR-08: bot token never client-side — worker returns verified: bool
  // For v1 MVP: skip server-side verification, accept Telegram context
  // TODO: add /verify endpoint on Cloudflare Worker before production
}


// ── Encryption (AES-256-GCM + PBKDF2) ────────────────────────────────────────
const ENCRYPT_MAGIC = "PIXENC1";

function isEncrypted(buffer) {
  if (buffer.byteLength < 7) return false;
  const header = new TextDecoder().decode(new Uint8Array(buffer, 0, 7));
  return header === ENCRYPT_MAGIC;
}

async function decryptVectors(encryptedBuffer, passphrase) {
  // Format: PIXENC1(7) + salt(16) + nonce(12) + ciphertext+tag(var)
  if (encryptedBuffer.byteLength < 7 + 16 + 12 + 16) {
    throw new Error("File too short to be a valid encrypted shard");
  }

  const salt       = new Uint8Array(encryptedBuffer,  7, 16);
  const nonce      = new Uint8Array(encryptedBuffer, 23, 12);
  const ciphertext = new Uint8Array(encryptedBuffer, 35);

  // Derive AES-256 key from passphrase (PBKDF2-HMAC-SHA256, 200K iterations)
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(passphrase),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 200_000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );

  // Decrypt — throws if passphrase wrong (GCM authentication failure)
  try {
    const plaintext = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: nonce },
      key,
      ciphertext
    );
    return plaintext;
  } catch {
    throw new Error("Wrong passphrase or corrupted file");
  }
}

// Show passphrase modal, return promise that resolves with passphrase
function askPassphrase(filename) {
  return new Promise((resolve, reject) => {
    // Create modal overlay
    const overlay = document.createElement("div");
    overlay.style.cssText = `
      position:fixed;inset:0;background:rgba(0,0,0,0.8);
      display:flex;align-items:center;justify-content:center;
      z-index:1000;padding:24px;
    `;

    overlay.innerHTML = `
      <div style="background:#161b22;border:1px solid #30363d;border-radius:16px;
                  padding:28px 24px;max-width:340px;width:100%;text-align:center;">
        <div style="font-size:28px;margin-bottom:12px;">🔒</div>
        <h3 style="margin-bottom:8px;font-size:17px;">Encrypted Index</h3>
        <p style="color:#8b949e;font-size:13px;margin-bottom:20px;line-height:1.5;">
          <strong>${filename}</strong> is encrypted.<br>
          Enter the passphrase you set when indexing.
        </p>
        <div style="background:#0d1117;border:1px solid #30363d;border-radius:8px;
                    padding:12px;margin-bottom:16px;text-align:left;">
          <div style="color:#e67e22;font-size:12px;margin-bottom:6px;">⚠️ Remember your passphrase</div>
          <div style="color:#8b949e;font-size:11px;line-height:1.5;">
            Without it you cannot import this index<br>on another device or after reinstall.
          </div>
        </div>
        <input id="pp-input" type="password" placeholder="Passphrase"
          style="width:100%;background:#0d1117;border:1px solid #30363d;
                 border-radius:8px;padding:12px;color:#e6edf3;font-size:15px;
                 outline:none;margin-bottom:8px;" />
        <div id="pp-error" style="color:#f85149;font-size:12px;
             min-height:16px;margin-bottom:8px;"></div>
        <button id="pp-ok" style="width:100%;background:#238636;color:white;
          border:none;border-radius:10px;padding:14px;font-size:15px;
          font-weight:600;cursor:pointer;margin-bottom:8px;">
          Unlock
        </button>
        <button id="pp-cancel" style="width:100%;background:transparent;
          color:#8b949e;border:1px solid #30363d;border-radius:10px;
          padding:10px;font-size:13px;cursor:pointer;">
          Cancel
        </button>
      </div>
    `;

    document.body.appendChild(overlay);

    const input  = overlay.querySelector("#pp-input");
    const errEl  = overlay.querySelector("#pp-error");
    const okBtn  = overlay.querySelector("#pp-ok");
    const cancel = overlay.querySelector("#pp-cancel");

    input.focus();

    function attempt() {
      const val = input.value.trim();
      if (!val) { errEl.textContent = "Enter passphrase"; return; }
      overlay.remove();
      resolve(val);
    }

    okBtn.addEventListener("click", attempt);
    cancel.addEventListener("click", () => {
      overlay.remove();
      reject(new Error("Cancelled"));
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") attempt();
      errEl.textContent = "";
    });

    // Allow retrying with error feedback (called from import flow)
    overlay._setError = msg => { errEl.textContent = msg; input.value = ""; input.focus(); };
  });
}

// ── IndexedDB ────────────────────────────────────────────────────────────────
const DB_NAME    = "pixory3";
const DB_VERSION = 3;
const STORE      = "vectors";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
          store.createIndex("path", "path", { unique: true });
        }
        if (!db.objectStoreNames.contains('settings'))
          db.createObjectStore('settings');
        if (!db.objectStoreNames.contains('shard_blob'))
          db.createObjectStore('shard_blob');
        if (!db.objectStoreNames.contains('thumb_offsets'))
          db.createObjectStore('thumb_offsets');
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function countVectors(db) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).count();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e => reject(e.target.error);
  });
}


// ── Serve token (for serve.py authenticated requests) ──────────────────────
async function getServeToken() {
  try {
    const tx    = db.transaction('settings', 'readonly');
    const store = tx.objectStore('settings');
    return await new Promise(r => {
      const req  = store.get('serve_token');
      req.onsuccess = () => r(req.result || '');
      req.onerror   = () => r('');
    });
  } catch { return ''; }
}

async function setServeToken(token) {
  try {
    const tx = db.transaction('settings', 'readwrite');
    tx.objectStore('settings').put(token.trim(), 'serve_token');
    await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
  } catch {}
}

// Build URL for serve.py with token (null if no token configured)
function serveUrl(relPath, token) {
  if (!token) return null;
  return `http://127.0.0.1:8765/${relPath}?token=${encodeURIComponent(token)}`;
}

let _serveToken = '';

async function loadServeToken() {
  _serveToken = await getServeToken();
}


// ── Lazy thumbnail loading (Idea 2+3: WebP + Blob lazy decode) ───────────────
// Shard file stored as raw Blob in IDB.
// At display time: slice Blob at offset → createObjectURL → display → revoke.
// Memory: only visible thumbnails ever decoded. No 100K array of data: URIs.

let _shardBlob = null;  // loaded once from IDB on startup

async function loadShardBlob() {
  try {
    const tx = db.transaction('shard_blob', 'readonly');
    const result = await new Promise(r => {
      const req = tx.objectStore('shard_blob').get('current');
      req.onsuccess = () => r(req.result || null);
      req.onerror   = () => r(null);
    });
    _shardBlob = result;
  } catch { _shardBlob = null; }
}

async function saveShardBlob(arrayBuffer) {
  const blob = new Blob([arrayBuffer]);
  const tx = db.transaction('shard_blob', 'readwrite');
  tx.objectStore('shard_blob').put(blob, 'current');
  await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
  _shardBlob = blob;
}

async function saveThumbOffsets(offsetMap) {
  const tx = db.transaction('thumb_offsets', 'readwrite');
  tx.objectStore('thumb_offsets').put(offsetMap, 'current');
  await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
}

async function loadThumbOffsets() {
  try {
    const tx = db.transaction('thumb_offsets', 'readonly');
    return await new Promise(r => {
      const req = tx.objectStore('thumb_offsets').get('current');
      req.onsuccess = () => r(req.result || {});
      req.onerror   = () => r({});
    });
  } catch { return {}; }
}

let _thumbOffsets = {};  // path → {offset, len}

// Get thumbnail URL for a result — lazy decode from Blob
// Returns object URL (caller must revoke) or null
function getThumbUrl(result) {
  // Priority 1: embedded data URL (small archives, --thumbs without lazy)
  if (result.thumbDataUrl) return result.thumbDataUrl;

  // Priority 2: lazy decode from shard Blob
  if (_shardBlob && _thumbOffsets[result.path]) {
    const { offset, len } = _thumbOffsets[result.path];
    if (len > 0) {
      const slice = _shardBlob.slice(offset, offset + len);
      return URL.createObjectURL(slice);  // caller must revoke
    }
  }

  // Priority 3: serve.py (home WiFi, PC on)
  if (_serveToken) {
    const safe = result.path.replace(/[^a-zA-Z0-9._-]/g, '_').substring(0, 120);
    return serveUrl(`thumbs/${safe}.webp`, _serveToken)
        || serveUrl(`thumbs/${safe}.jpg`, _serveToken);
  }

  return null;
}

// Build offset table during import (one-time, fast)
function buildThumbOffsets(buffer) {
  const view    = new DataView(buffer);
  const magic   = String.fromCharCode(...new Uint8Array(buffer, 0, 4));
  if (magic !== 'PXRY') return {};
  const version = view.getUint8(4);
  if (version !== 3) return {};

  const dim       = view.getUint16(5, true);
  const count     = view.getUint32(7, true);
  const hasLabels = view.getUint8(14) & 0x01;  // must match _parseV3
  const offsets   = {};
  let pos = 32;

  for (let i = 0; i < count; i++) {
    pos += dim;
    const ts   = view.getUint32(pos, true); pos += 4;
    const cc   = view.getUint16(pos, true); pos += 2;
    const clen = view.getUint8(pos);        pos += 1;
    pos += clen;
    pos += 8;                               // phash
    const plen = view.getUint16(pos, true); pos += 2;
    const path = new TextDecoder().decode(new Uint8Array(buffer, pos, plen));
    pos += plen;
    const tlen = view.getUint32(pos, true); pos += 4;
    if (tlen > 0) {
      offsets[path] = { offset: pos, len: tlen };
      pos += tlen;
    }
    // skip labels — always present (1 byte minimum), regardless of hasLabels flag
    // Python writes this byte unconditionally; must consume to stay in sync
    {
      const lc = view.getUint8(pos); pos += 1;
      pos += lc * 2;
    }
  }
  return offsets;
}

async function getAllVectors(db) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e => reject(e.target.error);
  });
}

// appendToStore: ADD records without clearing existing ones
// Used for multi-shard import (each shard appends)
async function appendToStore(db, records) {
  return new Promise((resolve, reject) => {
    const tx    = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    let i = 0;
    function next() {
      if (i >= records.length) { resolve(); return; }
      const req = store.add(records[i++]);
      req.onsuccess = next;
      req.onerror   = e => reject(e.target.error);
    }
    next();
    tx.onerror = e => reject(e.target.error);
  });
}

// clearAndStore: REPLACE all records (used for full re-import)
async function clearAndStore(db, records) {
  return new Promise((resolve, reject) => {
    const tx    = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    store.clear().onsuccess = () => {
      let i = 0;
      function next() {
        if (i >= records.length) { resolve(); return; }
        const req = store.add(records[i++]);
        req.onsuccess = next;
        req.onerror   = e => reject(e.target.error);
      }
      next();
    };
    tx.onerror = e => reject(e.target.error);
  });
}

// ── vectors.bin parser ────────────────────────────────────────────────────────
function parseVectorsBin(buffer) {
  const view   = new DataView(buffer);
  const magic  = String.fromCharCode(...new Uint8Array(buffer, 0, 4));
  if (magic !== "PXRY") throw new Error("Invalid file: not a Pixory vectors.bin");

  const version = view.getUint8(4);
  const dim     = view.getUint16(5, true);
  const count   = view.getUint32(7, true);

  // dim: 512=ViT-B/32, 768=ViT-L/14, 1024=RN50

  // v3: Int8 quantized, shards with country/city/phash (32-byte header)
  if (version === 3) return _parseV3(buffer, view, dim, count);
  // v1/v2: float32 legacy format
  // v1/v2: float32 legacy format

  const records = [];
  let offset = 16; // header size
  const dec  = new TextDecoder("utf-8");

  for (let i = 0; i < count; i++) {
    // Vector: 512 × float32 = 2048 bytes
    // Use buffer.slice() to create aligned copy — Float32Array requires
    // offset to be a multiple of 4, which variable-length paths break.
    const slice  = buffer.slice(offset, offset + dim * 4);
    const vector = new Float32Array(slice);
    offset += dim * 4;

    // Timestamp: uint32
    const ts = view.getUint32(offset, true);
    offset += 4;

    // Path: uint16 length + bytes
    const plen = view.getUint16(offset, true);
    offset += 2;
    const path = dec.decode(new Uint8Array(buffer, offset, plen));
    offset += plen;

    // Thumbnail: uint32 length + JPEG bytes (0 = no thumbnail)
    const tlen = view.getUint32(offset, true);
    offset += 4;
    let thumbDataUrl = "";
    if (tlen > 0) {
      const jpegBytes = new Uint8Array(buffer, offset, tlen);
      // Convert JPEG bytes to base64 data URL
      let binary = "";
      for (let j = 0; j < jpegBytes.length; j++) {
        binary += String.fromCharCode(jpegBytes[j]);
      }
      thumbDataUrl = "data:image/jpeg;base64," + btoa(binary);
      offset += tlen;
    }

    records.push({
      vector: Array.from(vector),
      ts,
      path,
      date:         ts ? new Date(ts * 1000).toISOString().slice(0, 10) : "",
      thumbDataUrl,
    });
  }

  return { count, records };
}

// Loaded from CDN with SRI (update hash when upgrading version)
let clipTokenizer = null;

// ── v3 parser (Int8 quantized, shards) ──────────────────────────────────────
// Security: validates magic, version, dimension before parsing any data
// Unhappy paths: corrupt file → throws (caught by caller → shows error)
function _parseV3(buffer, view, dim, count) {
  // Header: 32 bytes total
  // [0:4] magic, [4] version, [5:7] dim, [7:11] count,
  // [11:13] year, [13] quant, [14:32] reserved
  const quant    = view.getUint8(13);
  const hasLabels = view.getUint8(14) & 0x01;  // bit0: labels present in records
  if (quant !== 1) throw new Error(`Unsupported quantization: ${quant}`);

  const records = [];
  let offset = 32; // skip 32-byte header

  for (let i = 0; i < count; i++) {
    if (offset + dim > buffer.byteLength)
      throw new Error(`Truncated file at record ${i}`);

    // Int8 vector (dim bytes) → dequantize to float32
    // dim is read from header (supports ViT-B/32=512, ViT-L/14=768, RN50=1024)
    const raw = new Int8Array(buffer, offset, dim);
    const vector = new Float32Array(dim);
    for (let j = 0; j < dim; j++) vector[j] = raw[j] / 127.0;
    offset += dim;

    // ts (uint32), cc (uint16), clen (uint8)
    const ts   = view.getUint32(offset, true);     offset += 4;
    const cc   = view.getUint16(offset, true);     offset += 2;
    const clen = view.getUint8(offset);            offset += 1;

    // city (UTF-8, clen bytes)
    const city = clen > 0
      ? new TextDecoder().decode(new Uint8Array(buffer, offset, clen))
      : "";
    offset += clen;

    // phash (uint64 as two uint32 — JS can't do BigInt64 in all contexts)
    const phLo = view.getUint32(offset, true);
    const phHi = view.getUint32(offset + 4, true);
    offset += 8;

    // path
    const plen = view.getUint16(offset, true);     offset += 2;
    const path = new TextDecoder().decode(new Uint8Array(buffer, offset, plen));
    offset += plen;

    // thumbnail
    const tlen = view.getUint32(offset, true);     offset += 4;
    let thumbDataUrl = "";
    if (tlen > 0) {
      const jpegBytes = new Uint8Array(buffer, offset, tlen);
      let bin = "";
      for (let k = 0; k < jpegBytes.length; k++) bin += String.fromCharCode(jpegBytes[k]);
      thumbDataUrl = "data:image/jpeg;base64," + btoa(bin);
      offset += tlen;
    }

    // ── labels (v3.1+) ──────────────────────────────────────────────────────
    // CRITICAL FIX: Python _write_shard ALWAYS writes a labels byte per record
    // (minimum b"\x00" = 0 labels) regardless of the hasLabels header flag.
    // We must ALWAYS consume it here to keep offset in sync with the file.
    // Previous bug: only reading when hasLabels=1 → offset drift of N bytes
    // after N records → garbage count read → "Invalid typed array length" crash.
    let labels = null;
    {
      const labelCount = view.getUint8(offset); offset += 1;
      if (labelCount > 0) {
        const labelsRaw = new Uint8Array(buffer, offset, labelCount * 2);
        labels = new Uint8Array(labelsRaw);  // copy — don't hold view into buffer
        offset += labelCount * 2;
      }
    }

    const name = path.split(/[\/]/).pop() || path;
    const date = ts ? new Date(ts * 1000).toISOString().slice(0, 10) : "";

    records.push({ vector, ts, path, date, name, cc, city, thumbDataUrl, labels });
  }
  return records;
}

// ── Minimal CLIP BPE Tokenizer (pure JS, no dependencies) ─────────────────
class CLIPTokenizer {
  constructor(vocab, merges) {
    this.vocab = vocab;
    this.merges = {};
    merges.forEach((m, i) => { this.merges[m] = i; });
    this._b2u = this._buildB2U();
    this._cache = {};
  }
  _buildB2U() {
    const bs = [], cs = [];
    const push = (b) => { bs.push(b); cs.push(b); };
    for (let b=33; b<=126; b++) push(b);
    for (let b=161; b<=172; b++) push(b);
    for (let b=174; b<=255; b++) push(b);
    let n=0;
    for (let b=0; b<256; b++) {
      if (!bs.includes(b)) { bs.push(b); cs.push(256+n); n++; }
    }
    const m = {};
    bs.forEach((b,i) => { m[b] = String.fromCodePoint(cs[i]); });
    return m;
  }
  _pairs(w) {
    const s = new Set();
    for (let i=0; i<w.length-1; i++) s.add(w[i]+'\x00'+w[i+1]);
    return s;
  }
  _bpe(token) {
    if (this._cache[token]) return this._cache[token];
    let w = token.split('').map(c => {
      let out='';
      for (const byte of new TextEncoder().encode(c))
        out += this._b2u[byte] || String.fromCodePoint(byte);
      return out;
    });
    let pairs = this._pairs(w);
    while (pairs.size) {
      let best=null, bestR=Infinity;
      for (const p of pairs) {
        const r = this.merges[p.replace('\x00',' ')];
        if (r!==undefined && r<bestR) { bestR=r; best=p; }
      }
      if (!best) break;
      const [a,b] = best.split('\x00');
      const nw=[];
      let i=0;
      while (i<w.length) {
        const j = w.indexOf(a, i);
        if (j===-1) { nw.push(...w.slice(i)); break; }
        nw.push(...w.slice(i,j));
        if (j<w.length-1 && w[j+1]===b) { nw.push(a+b); i=j+2; }
        else { nw.push(a); i=j+1; }
      }
      w=nw;
      if (w.length===1) break;
      pairs=this._pairs(w);
    }
    const r=w.join(' ');
    this._cache[token]=r;
    return r;
  }
  tokenize(text, maxLen=77) {
    text = text.toLowerCase().replace(/\s+/g,' ').trim();
    const SOT = this.vocab['<|startoftext|>'];
    const EOT = this.vocab['<|endoftext|>'];
    const ids=[SOT];
    const words = text.match(/[\w']+|[^\w\s]/g) || [];
    for (const word of words) {
      const bpe = this._bpe(word+'</w>').split(' ');
      for (const t of bpe) { if (this.vocab[t]!==undefined) ids.push(this.vocab[t]); }
    }
    ids.push(EOT);
    const inputIds = new Array(maxLen).fill(0);
    const attMask  = new Array(maxLen).fill(0);
    const n = Math.min(ids.length, maxLen);
    for (let i=0;i<n;i++) { inputIds[i]=ids[i]; attMask[i]=1; }
    return { inputIds, attMask };
  }
}

  await step("AI ready ✓");

  // ── Pre-warm: run one dummy query so first real search is fast ────────────
  // ONNX WASM JIT-compiles on first inference (~3-4s). Pre-warming here

  // Inspect what the ONNX model expects/returns
  const inputNames  = session.inputNames  || [];
  const outputNames = session.outputNames || [];
  console.log("[Pixory] ONNX inputs:", inputNames);
  console.log("[Pixory] ONNX outputs:", outputNames);

  // Cache: which output name to use (decided on first run from actual dims)
  let _bestOutputKey = null;
  let _diagLogged = false;

  window._encodeText = async (query) => {
    const {inputIds, attMask} = tokenizer.tokenize(query);
    const n = inputIds.length;

    // Build feeds based on what the model actually wants (skip unknown inputs)
    const feeds = {};
    for (const name of inputNames) {
      if (name === "input_ids" || name === "tokens" || name === "ids") {
        feeds[name] = new ort.Tensor("int64", BigInt64Array.from(inputIds, BigInt), [1,n]);
      } else if (name === "attention_mask" || name === "mask") {
        feeds[name] = new ort.Tensor("int64", BigInt64Array.from(attMask, BigInt), [1,n]);
      }
    }
    // Fallback when inputNames is empty
    if (Object.keys(feeds).length === 0) {
      feeds.input_ids = new ort.Tensor("int64", BigInt64Array.from(inputIds, BigInt), [1,n]);
    }

    const out = await session.run(feeds);

    // Pick output with the right shape on FIRST call, then cache the name
    if (!_bestOutputKey) {
      // Priority: text_embeds > pooler_output > any 2D [1, D] output
      // REJECT 3D outputs (like last_hidden_state which is [1, 77, 768])
      const priority = ["text_embeds", "pooler_output", "last_hidden_state"];
      let candidates = [];
      for (const name of Object.keys(out)) {
        const t = out[name];
        const dims = t.dims || [];
        const is2D = dims.length === 2;
        candidates.push({name, dims, is2D, data: t.data});
        console.log(`[Pixory] output "${name}" dims:`, dims, "len:", t.data.length);
      }
      // Prefer 2D outputs by priority name
      for (const p of priority) {
        if (candidates.find(c => c.name === p && c.is2D)) {
          _bestOutputKey = p; break;
        }
      }
      // Fallback: first 2D output
      if (!_bestOutputKey) {
        const c2d = candidates.find(c => c.is2D);
        if (c2d) _bestOutputKey = c2d.name;
      }
      // Last resort: just use last output
      if (!_bestOutputKey) _bestOutputKey = Object.keys(out).at(-1);
      console.log("[Pixory] Selected output:", _bestOutputKey);
    }

    // Extract embedding from chosen output
    let vec = new Float32Array(out[_bestOutputKey].data);

    // If we ended up with a 3D last_hidden_state, extract EOS token embedding
    // (the last non-pad token's hidden state — CLIP's actual text representation)
    const dims = out[_bestOutputKey].dims || [];
    if (dims.length === 3 && dims[2] === 768) {
      // Find EOS position (last 1 in attention mask)
      let eosPos = 0;
      for (let i = n - 1; i >= 0; i--) if (attMask[i] === 1) { eosPos = i; break; }
      const slice = new Float32Array(768);
      const base = eosPos * 768;
      for (let i = 0; i < 768; i++) slice[i] = vec[base + i];
      vec = slice;
      if (!_diagLogged) {
        console.log("[Pixory] Extracted EOS token at pos", eosPos);
        _diagLogged = true;
      }
    }

    // L2 normalize for cosine similarity
    let norm = 0;
    for (let i = 0; i < vec.length; i++) norm += vec[i] * vec[i];
    norm = Math.sqrt(norm);
    if (norm > 1e-8) for (let i = 0; i < vec.length; i++) vec[i] /= norm;

    // Diagnostic: log query vector stats once
    if (!_diagLogged) {
      console.log("[Pixory] Query vec dim:", vec.length,
                  "min:", Math.min(...vec).toFixed(3),
                  "max:", Math.max(...vec).toFixed(3),
                  "first5:", Array.from(vec.slice(0,5)).map(x => x.toFixed(3)));
      _diagLogged = true;
    }

    return vec;
  };
}
async function textEmbed(query) {
  if (!window._encodeText) throw new Error("AI encoder not initialized");
  // Cache: identical queries (e.g. debounce firing twice) skip ONNX entirely
  if (!textEmbed._cache) textEmbed._cache = new Map();
  const cached = textEmbed._cache.get(query);
  if (cached) return cached;
  const vec = await window._encodeText(query);
  // Keep last 32 queries; evict oldest on overflow
  if (textEmbed._cache.size >= 32) {
    textEmbed._cache.delete(textEmbed._cache.keys().next().value);
  }
  textEmbed._cache.set(query, vec);
  return vec;
}

// ── Cosine similarity (batch, optimised) ─────────────────────────────────────
function cosineSimilarity(a, b) {
  // Both assumed L2-normalized (CLIP outputs are normalized)
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return dot;
}

const NEGATIVE_LABEL_IDS = new Set([57,58,59,60,61,62,63,64,65,66,67]);

/**
 * Parse labels from binary: uint8 count + N×(uint8 id, uint8 score_i8)
 * Returns array of [labelText, normalizedScore] pairs.
 */
function parseLabels(labelsUint8) {
  if (!labelsUint8 || labelsUint8.length === 0) return [];
  const count = labelsUint8[0];
  const result = [];
  for (let i = 0; i < count; i++) {
    const offset = 1 + i * 2;
    if (offset + 1 >= labelsUint8.length) break;
    const id    = labelsUint8[offset];
    const score = labelsUint8[offset + 1] / LABEL_SCORE_SCALE;
    if (id < LABEL_VOCAB.length) result.push([LABEL_VOCAB[id], score, id]);
  }
  return result;
}

/**
 * Parse a search query into keywords.
 * "baby sleeping at beach" → ["baby","sleeping","beach"]
 * Strips stopwords, normalises to lowercase.
 */
const STOPWORDS = new Set(["a","an","the","of","in","on","at","to","for","with",
  "and","or","is","my","photo","picture","image","photos"]);
function parseKeywords(query) {
  return query.toLowerCase()
    .replace(/[^a-zа-яёüöä\s]/gi, ' ')
    .split(/\s+/)
    .filter(w => w.length >= 2 && !STOPWORDS.has(w));
}

/**
 * iOS-style hybrid score:
 *   - If garbage labels dominate → heavily penalise (never shows)
 *   - If keywords match labels  → label score drives result (high precision)
 *   - If no keyword match       → CLIP score * dampening (semantic fallback)
 *
 * Returns score in [0, 1].
 */
function hybridScore(clipScore, labels, keywords) {
  if (!labels || labels.length === 0) {
    // No label data (old index) — fall back to pure CLIP
    return clipScore;
  }

  // Garbage detection: if top labels are negative → bury the photo
  const isGarbage = labels.some(([, s, id]) => NEGATIVE_LABEL_IDS.has(id) && s > 0.45);
  if (isGarbage) return clipScore * 0.05;  // ≈ invisible

  if (!keywords || keywords.length === 0) return clipScore;

  // Label matching: for each query keyword, check if any label matches
  let matchScore = 0;
  let matchCount = 0;
  for (const kw of keywords) {
    let best = 0;
    for (const [lbl, s] of labels) {
      // Substring match: "baby" matches "baby", "infant" doesn't match "bab"
      if (lbl.includes(kw) || kw.includes(lbl.split(' ')[0])) {
        best = Math.max(best, s);
      }
    }
    if (best > 0) { matchScore += best; matchCount++; }
  }

  const coverage = matchCount / keywords.length;  // fraction of keywords matched
  const avgLabelScore = matchScore / Math.max(1, matchCount);

  if (matchCount === 0) {
    // No label match at all — pure CLIP with slight dampening
    // (still allows semantic search for concepts not in vocab)
    return clipScore * 0.75;
  }

  // Blend: 35% CLIP + 65% label match (label match dominates for precision)
  return 0.35 * clipScore + 0.65 * (coverage * avgLabelScore);
}

function topK(queryVec, vectors, paths, dates, k = 20) {
  if (!vectors || vectors.length === 0) return [];

  const scored = vectors.map((v, i) => {
    const raw = cosineSimilarity(queryVec, v);
    const penalty = _hubPenalty ? _hubPenalty[i] : 0;
    return {
      score: raw * (1 - penalty),  // hub-adjusted score for ranking
      raw:   raw,                  // original cosine similarity
      penalty: penalty,
      path:  paths[i],
      date:  dates ? dates[i] : "",
      idx:   i,
    };
  }).sort((a, b) => b.score - a.score);

  // Always return top results — no hard cutoff that hides everything.
  // Results below SCORE_CUTOFF shown with reduced opacity (handled in render).
  return scored.slice(0, k);
}

// ── Prompt expansion for CLIP ──────────────────────────────────────────────
// CLIP was trained on image captions. Short queries get expanded to caption style.
// Tested expansion strategies for personal photo libraries.
function expandQuery(q) {
  const low = q.trim().toLowerCase();
  // Already has context words — use as-is
  if (low.split(/\s+/).length >= 4) return q;
  // Short query → expand with CLIP-friendly prefix
  return `a photo of ${q.trim()}`;
}

// ── Adaptive Whitening ─────────────────────────────────────────────────────
// Per-dimension z-scoring of image vectors.
// Removes the "universal photo direction" that dominates homogeneous libraries.
// Works for any dataset diversity level — computed from THIS library's stats.
//
// Reference: covariance normalization improves cross-modal CLIP retrieval.
// Both stored vectors AND query are whitened with the SAME parameters,
// so cosine similarity in whitened space is well-defined.

let _wMean = null;       // Float32Array(D): per-dimension mean of image vecs
let _wStd  = null;       // Float32Array(D): per-dimension std of image vecs
let _wVecs = null;       // Float32Array[]: pre-whitened + L2-normalized image vecs

const WHITEN_EPS = 0.05; // Floor on std — prevents infinite amplification of
                          // near-zero-variance dims; 0.05 = max 20x amplification

function computeWhitening() {
  if (!cachedVecs || cachedVecs.length < 5) { _wVecs = null; return; }
  const N = cachedVecs.length;
  const D = cachedVecs[0].length;
  const t0 = performance.now();

  // 1. Per-dimension mean
  _wMean = new Float32Array(D);
  for (const v of cachedVecs)
    for (let d = 0; d < D; d++) _wMean[d] += v[d];
  for (let d = 0; d < D; d++) _wMean[d] /= N;

  // 2. Per-dimension std (with epsilon floor)
  _wStd = new Float32Array(D).fill(0);
  for (const v of cachedVecs)
    for (let d = 0; d < D; d++) {
      const diff = v[d] - _wMean[d];
      _wStd[d] += diff * diff;
    }
  for (let d = 0; d < D; d++)
    _wStd[d] = Math.max(Math.sqrt(_wStd[d] / N), WHITEN_EPS);

  // 3. Pre-whiten all image vectors
  _wVecs = cachedVecs.map(v => _applyWhitening(v));

  // Diagnostics
  const meanDot = _wVecs.reduce((s, v, i) => {
    let d = 0; for (let j = 0; j < v.length; j++) d += v[j] * _wVecs[0][j];
    return s + d;
  }, 0) / N;
  console.log(`[Pixory] Whitening done in ${Math.round(performance.now()-t0)}ms | ` +
              `N=${N} D=${D} | mean_dot_after: ${meanDot.toFixed(3)} ` +
              `(target: ~0 for well-centred vectors)`);
}

function _applyWhitening(v) {
  const D = v.length;
  const out = new Float32Array(D);
  for (let d = 0; d < D; d++) out[d] = (v[d] - _wMean[d]) / _wStd[d];
  // L2-normalize
  let norm = 0;
  for (const x of out) norm += x * x;
  norm = Math.sqrt(norm);
  if (norm > 1e-8) for (let d = 0; d < D; d++) out[d] /= norm;
  return out;
}

// ── Hub detection (k-occurrence based) ─────────────────────────────────────
// A photo is a HUB if it appears in top-K nearest neighbors of many other photos.
// Hubs are "generically similar to everything" (e.g. blurry, closet door, sky)
// and get penalized at search time.
//
// IMPORTANT difference from global mean dehubbify:
//   Mean dehubbify subtracts the "average" direction → if your library is
//   mostly baby photos, this REMOVES the baby signal.
//   K-occurrence specifically identifies photos that are nearest neighbors
//   of MANY others, while leaving the dominant subject untouched.

let _hubPenalty = null;  // Float32Array[N], 0..0.3 penalty multiplier per photo

function detectHubs() {
  if (!cachedVecs || cachedVecs.length < 30) {
    _hubPenalty = null;
    return;
  }
  const N = cachedVecs.length;
  const K = Math.min(15, Math.floor(N / 10));   // k-NN size
  const t0 = performance.now();
  const counts = new Int32Array(N);

  // For each photo, find its top-K neighbors and increment their counts
  const sims = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const a = cachedVecs[i];
    // pairwise cosine (vecs are L2-normalized already)
    for (let j = 0; j < N; j++) {
      if (i === j) { sims[j] = -2; continue; }
      const b = cachedVecs[j];
      let s = 0;
      for (let k = 0; k < a.length; k++) s += a[k] * b[k];
      sims[j] = s;
    }
    // Partial top-K: simple selection (avoids full sort)
    const topIdx = new Int32Array(K);
    const topScore = new Float32Array(K).fill(-3);
    for (let j = 0; j < N; j++) {
      const s = sims[j];
      // Insert if better than the worst in topK
      let worstIdx = 0;
      for (let k = 1; k < K; k++) if (topScore[k] < topScore[worstIdx]) worstIdx = k;
      if (s > topScore[worstIdx]) {
        topScore[worstIdx] = s;
        topIdx[worstIdx] = j;
      }
    }
    for (let k = 0; k < K; k++) counts[topIdx[k]]++;
  }

  // Convert counts to penalty: normal photos have count ~= K, hubs have count >> K.
  // Penalty: 0 for normal, up to 0.30 for severe hubs.
  _hubPenalty = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const ratio = counts[i] / K;          // 1.0 = normal, >2 = hub-ish
    _hubPenalty[i] = Math.min(0.30, Math.max(0, (ratio - 2) * 0.06));
  }

  // Log top hubs for diagnostics
  const hubList = Array.from(counts).map((c, i) => ({c, i, p: _hubPenalty[i]}))
    .sort((a, b) => b.c - a.c).slice(0, 5);
  const ms = Math.round(performance.now() - t0);
  console.log("[Pixory] Hub detection (" + ms + "ms): top 5 hubs (k-occurrence/penalty):");
  hubList.forEach(h =>
    console.log("  " + (cachedPaths[h.i] || "").split(/[\\/]/).pop() +
                " — count " + h.c + " penalty " + (h.p*100).toFixed(0) + "%"));
}

// ── Legacy hubness reduction (kept for compatibility, NOT used in search) ── ─────────────────────────────────────────────────────────
// Hub photos (e.g. closet door) have vectors near the mean of the space
// and incorrectly appear relevant to every query.
// Fix: project out the mean direction from ALL vectors (stored + query).
// Applied once to stored vectors at load time, applied to each query at search time.

let _meanVec  = null;  // unit vector = mean direction
let _dehubbed = null;  // dehubbified version of cachedVecs

function _dehubbify(vec) {
  if (!_meanVec) return vec;
  // v' = v - (v·mean)·mean  →  projects out the "generic" direction
  let dot = 0;
  for (let i = 0; i < vec.length; i++) dot += vec[i] * _meanVec[i];
  const out = new Float32Array(vec.length);
  let norm2 = 0;
  for (let i = 0; i < vec.length; i++) {
    out[i] = vec[i] - dot * _meanVec[i];
    norm2 += out[i] * out[i];
  }
  const norm = Math.sqrt(norm2);
  if (norm > 1e-8) for (let i = 0; i < vec.length; i++) out[i] /= norm;
  return out;
}

function _preprocessVecs() {
  if (!cachedVecs || cachedVecs.length === 0) return;
  const dim = cachedVecs[0].length;

  // Compute mean of all stored vectors and normalize to unit vector
  const mean = new Float32Array(dim);
  for (const v of cachedVecs) for (let i = 0; i < dim; i++) mean[i] += v[i];
  for (let i = 0; i < dim; i++) mean[i] /= cachedVecs.length;
  let norm = 0;
  for (let i = 0; i < dim; i++) norm += mean[i] * mean[i];
  norm = Math.sqrt(norm);
  if (norm < 1e-8) { _meanVec = null; _dehubbed = null; return; }
  _meanVec = new Float32Array(dim);
  for (let i = 0; i < dim; i++) _meanVec[i] = mean[i] / norm;

  // Dehubbify ALL stored vectors once — project out the mean direction
  _dehubbed = cachedVecs.map(v => _dehubbify(v));

  // Verify: check score variance — good dehubbify increases spread
  const testQ = _dehubbify(cachedVecs[0]);
  const testScores = _dehubbed.slice(0, 20).map(v => cosineSimilarity(testQ, v)).sort((a,b)=>b-a);
  console.log('[Pixory] Dehubbify OK | vectors:', _dehubbed.length,
    '| test top3:', testScores.slice(0,3).map(s=>s.toFixed(3)),
    '| mean_dot:', (cachedVecs.reduce((s,v)=>{
      let d=0; for(let i=0;i<dim;i++) d+=v[i]*_meanVec[i]; return s+d;
    },0)/cachedVecs.length).toFixed(3));
}

// ── Geo filter state ───────────────────────────────────────────────────────────
let _activeCC = 0;   // 0 = all countries

function buildGeoIndex() {
  // {countryCode → count}
  const counts = {};
  if (!cachedVecs) return {};
  for (let i = 0; i < cachedPaths.length; i++) {
    const cc = cachedCC ? cachedCC[i] : 0;
    if (cc) counts[cc] = (counts[cc] || 0) + 1;
  }
  return counts;
}

function renderGeoChips() {
  const counts = buildGeoIndex();
  const chips  = document.getElementById('geo-chips-inner');
  const wrap   = document.getElementById('geo-chips');
  const entries = Object.entries(counts)
    .filter(([cc]) => cc > 0)
    .sort((a, b) => b[1] - a[1]);

  if (entries.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';

  chips.innerHTML = '';

  // "All" chip
  const all = document.createElement('div');
  all.className = 'geo-chip' + (_activeCC === 0 ? ' chip-active' : '');
  all.innerHTML = '<span class="chip-flag">🌍</span> All';
  all.onclick = () => setGeoFilter(0);
  chips.appendChild(all);

  for (const [cc, cnt] of entries) {
    const c   = parseInt(cc);
    const div = document.createElement('div');
    div.className = 'geo-chip' + (_activeCC === c ? ' chip-active' : '');
    div.innerHTML = `<span class="chip-flag">${CC_FLAG(c)}</span>
      ${CC_NAME(c)}
      <span class="chip-count">${cnt}</span>`;
    div.onclick = () => setGeoFilter(c);
    chips.appendChild(div);

}

function setGeoFilter(cc) {
  _activeCC = cc;
  renderGeoChips();

    const q = document.getElementById('search-input').value.trim();
    if (q) {
      runSearch(q).catch(err => {
        console.error("[Pixory] Search error:", err);

function filteredIndices() {
  if (!cachedVecs) return [];
  if (_activeCC === 0) return cachedVecs.map((_, i) => i);
  return cachedVecs
    .map((_, i) => i)
    .filter(i => (cachedCC ? cachedCC[i] : 0) === _activeCC);

// ── Browse mode (virtual scroll) ──────────────────────────────────────────────
let _currentTab   = 'search';
let _browseItems  = [];    // all filtered indices sorted by date desc
let _browseOffset = 0;
const BROWSE_BATCH = 60;   // items per render batch
let _browseObserver = null;

function switchTab(tab) {
  _currentTab = tab;
  document.getElementById('tab-search').classList.toggle('tab-active', tab === 'search');
  document.getElementById('tab-browse').classList.toggle('tab-active', tab === 'browse');
  document.getElementById('top-bar-search').style.display = tab === 'search' ? '' : 'none';
  document.getElementById('top-bar-browse').style.display = tab === 'browse' ? '' : 'none';
  document.getElementById('results-grid').style.display   = tab === 'search' ? '' : 'none';
  document.getElementById('browse-grid').style.display    = tab === 'browse' ? '' : 'none';
  document.getElementById('status-bar').style.display     = tab === 'search' ? '' : 'none';
  if (tab === 'browse') startBrowse();
}

function startBrowse() {
  const indices = filteredIndices();
  // Sort by timestamp descending (newest first)
  _browseItems = indices.sort((a, b) => {
    const ta = cachedDates[a] || '';
    const tb = cachedDates[b] || '';
    return tb.localeCompare(ta);
  });
  _browseOffset = 0;
  document.getElementById('browse-grid').innerHTML = '';
  document.getElementById('browse-count').textContent =
    _browseItems.length + ' photos';

  // Disconnect old observer
  if (_browseObserver) _browseObserver.disconnect();

  renderBrowseBatch();

  // Sentinel: load more when bottom reached
  const sentinel = document.getElementById('browse-sentinel');
  sentinel.style.display = '';
  _browseObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && _browseOffset < _browseItems.length) {
      renderBrowseBatch();
    }
  }, { rootMargin: '200px' });
  _browseObserver.observe(sentinel);
}

function renderBrowseBatch() {
  const grid  = document.getElementById('browse-grid');
  const batch = _browseItems.slice(_browseOffset, _browseOffset + BROWSE_BATCH);
  _browseOffset += batch.length;

  for (const idx of batch) {
    const item = makeThumbnailItem({
      path:         cachedPaths[idx],
      date:         cachedDates[idx],
      thumbDataUrl: cachedThumbs ? cachedThumbs[idx] : '',
      cc:           cachedCC    ? cachedCC[idx]      : 0,
      score:        null,        // no score in browse mode
    });
    grid.appendChild(item);
  }
}

// ── Shared thumbnail item factory ─────────────────────────────────────────────
function makeThumbnailItem(r) {
  const item = document.createElement('div');
  // score=null means browse mode (no query) — always full opacity
  // score is a number means search result — opacity encodes confidence
  const confidence = r.score === null ? 1.0 :
                     r.score >= 0.23 ? 1.0 :
                     r.score >= 0.21 ? 0.85 :
                     r.score >= 0.19 ? 0.65 : 0.45;
  item.style.opacity = confidence;
  item.className = 'result-item';
  const name = r.path.split(/[/\\]/).pop();
  const url  = getThumbUrl(r);

  let inner = '';
  if (url) {
    const isBlob = url.startsWith('blob:');
    inner = `<img src="${url}"
      style="width:100%;height:100%;object-fit:cover;display:block;"
      loading="lazy"
      onload="if(this.src.startsWith('blob:'))URL.revokeObjectURL && (URL.revokeObjectURL && URL.revokeObjectURL(this.src))"
      onerror="if(this.src.startsWith('blob:'))URL.revokeObjectURL && (URL.revokeObjectURL && URL.revokeObjectURL(this.src));this.style.display='none'">`;
  } else {
    inner = `<div style="width:100%;height:100%;display:flex;align-items:center;
      justify-content:center;background:#161b22;flex-direction:column;gap:3px">
      <div style="font-size:22px">🖼</div>
      <div style="font-size:9px;color:#555;padding:2px 4px;text-align:center;
        word-break:break-all;line-height:1.3">${name}</div>
    </div>`;
  }

  const scoreTag = r.score !== null
    ? `<span class="score">${(r.score*100).toFixed(0)}%</span>` : '';
  const dateTag  = r.date
    ? `<span class="date">${r.date}</span>` : '';
  const geoTag   = r.cc
    ? `<span class="geo-tag">${CC_FLAG(r.cc)}</span>` : '';

  item.innerHTML = inner + scoreTag + dateTag + geoTag;

  item.addEventListener('click', () => {
    // If serve.py token available: try to open original
    if (_serveToken) {
      const originalUrl = serveUrl(name, _serveToken);
      if (tg) {
        tg.openLink(originalUrl);
      } else {
        window.open(originalUrl, '_blank');
      }
      return;
    }
    // Fallback: show info popup
    const info = [
      name,
      r.date || '',
      r.cc ? CC_FLAG(r.cc) + ' ' + CC_NAME(r.cc) : '',
      r.score !== null ? 'Score: ' + (r.score*100).toFixed(0) + '%' : ''
    ].filter(Boolean).join('\n');
    if (tg) tg.showPopup({ title: 'Photo info', message: info, buttons:[{type:'close'}] });
    else alert(info);
  });
  return item;
}

// ── Search ────────────────────────────────────────────────────────────────────
const searchInput = document.getElementById("search-input");
const grid        = document.getElementById("results-grid");
const statusBar   = document.getElementById("status-bar");

let searchTimer = null;

searchInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    searchInput.blur();
    const q = searchInput.value.trim();
    if (q) runSearch(q);
    else renderResults([], "");
  }
});

function _onSearchChange() {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) {
    grid.innerHTML = "";
    statusBar.textContent = `${cachedVecs?.length ?? 0} photos indexed`;
    return;
  }
  searchTimer = setTimeout(() => runSearch(q), 300);
}
searchInput.addEventListener("input", _onSearchChange);
// keyup: TG WebView fallback for cases where `input` doesn't fire (e.g. IME, paste).
// Guard: only act if value actually changed since last `input` event.
let _lastSearchVal = "";
searchInput.addEventListener("keyup", () => {
  const v = searchInput.value;
  if (v !== _lastSearchVal) { _lastSearchVal = v; _onSearchChange(); }
});
searchInput.addEventListener("input", () => { _lastSearchVal = searchInput.value; }, { capture: true });


// Russian → English photo search vocabulary.
// Replaces MyMemory API from Pixory 1 — no external calls, fully private.
// ~100 most common personal photo search terms.
const RU_EN = {
  // People
  "ребёнок":"baby","ребенок":"baby","малыш":"baby","малышка":"baby",
  "дочь":"daughter","сын":"son","дочка":"daughter","сынок":"son",
  "мама":"mom","папа":"dad","бабушка":"grandma","дедушка":"grandpa",
  "семья":"family","дети":"children","ребята":"kids",
  // Activities
  "спит":"sleeping","спящий":"sleeping","спать":"sleeping",
  "ест":"eating","кушает":"eating","еда":"food","кормление":"feeding",
  "играет":"playing","играет":"playing","игра":"playing","игрушки":"toys",
  "улыбается":"smiling","смеётся":"laughing","плачет":"crying",
  "купается":"swimming","плавает":"swimming","ванна":"bath",
  "ходит":"walking","бежит":"running","прыгает":"jumping",
  "читает":"reading","рисует":"drawing","танцует":"dancing",
  // Places
  "море":"sea","пляж":"beach","вода":"water","океан":"ocean",
  "парк":"park","сад":"garden","лес":"forest","горы":"mountains",
  "дом":"home","дома":"home","комната":"room","спальня":"bedroom",
  "кухня":"kitchen","улица":"street","город":"city",
  "бассейн":"pool","природа":"nature","снег":"snow",
  // Events
  "день рождения":"birthday","праздник":"celebration","новый год":"new year",
  "торт":"cake","свечи":"candles","подарок":"gift","подарки":"gifts",
  "первый раз":"first time","первые шаги":"first steps",
  // Descriptors
  "милый":"cute","красивый":"beautiful","смешной":"funny",
  "маленький":"little","большой":"big","новый":"new",
  "утро":"morning","вечер":"evening","ночь":"night","лето":"summer",
  "зима":"winter","осень":"autumn","весна":"spring",
  // Objects
  "собака":"dog","кошка":"cat","животное":"animal",
  "машина":"car","самолёт":"airplane","велосипед":"bicycle",
  "цветы":"flowers","дерево":"tree","трава":"grass",
};

function translateQuery(q) {
  // Replace Russian words with English equivalents
  let result = q.toLowerCase();
  // Sort by length descending to match longer phrases first
  const entries = Object.entries(RU_EN).sort((a,b) => b[0].length - a[0].length);
  for (const [ru, en] of entries) {
    result = result.replace(new RegExp(ru, 'g'), en);
  }
  return result;
}

async function runSearch(query) {
  const grid = document.getElementById("results-grid");
  if (!cachedVecs || !window._encodeText) return;
  if (grid) grid.innerHTML = `<div style="grid-column:1/-1;padding:32px;text-align:center;color:#8E8E93">Searching…</div>`;

  try {
    const t0  = performance.now();
    const qv  = await textEmbed(expandQuery(query));
    const kws = parseKeywords(translateQuery(query));

    // hasLabels = true only if at least one photo has ≥1 actual label
    // (Uint8Array([0]) is truthy but means 0 labels — don't treat as labeled)
    const hasLabels = !!(cachedLabels &&
      cachedLabels.some(l => l && l.length > 1 && l[0] > 0));

    const scored = [];
    for (let i = 0; i < cachedVecs.length; i++) {
      const path = cachedPaths[i] || '';
      // Skip PNGs (screenshots, UI exports — rarely meaningful in photo search)
      if (path.toLowerCase().endsWith('.png')) continue;

      const rawClip = cosineSimilarity(qv, cachedVecs[i]);
      const hubP    = _hubPenalty ? _hubPenalty[i] : 0;
      const clip    = rawClip * (1 - hubP);

      if (hasLabels && kws.length > 0 && cachedLabels[i]) {
        const labels = parseLabels(cachedLabels[i]);
        if (labels.length > 0) {
          // Hard filter: photo labeled as screenshot/document/UI
          if (labels.some(([,s,id]) => NEGATIVE_LABEL_IDS.has(id) && s > 0.45))
            continue;

          // Keyword match against labels
          let matched = 0, labelScore = 0;
          for (const kw of kws) {
            let best = 0;
            for (const [lbl, s] of labels)
              if (lbl.includes(kw) || kw.includes(lbl.split(' ')[0]))
                best = Math.max(best, s);
            labelScore += best;
            if (best > 0) matched++;
          }
          labelScore /= kws.length;

          // No label match AND weak CLIP → exclude entirely
          if (matched === 0 && clip < 0.22) continue;

          // Hybrid: 30% CLIP + 70% label
          scored.push({ score: 0.30 * clip + 0.70 * labelScore, idx: i, path,
                        date: cachedDates?.[i] ?? '' });
          continue;
        }
      }

      // CLIP-only path (no labels, or photo has no label data):
      // Store raw clip score for distribution analysis below
      scored.push({ score: clip, idx: i, path, date: cachedDates?.[i] ?? '', _clipOnly: true });
    }

    // ── iOS-style relevance filtering ─────────────────────────────────────
    // With labels: scores range 0.05–0.85, threshold at 0.15 is meaningful
    // CLIP-only: scores range 0.19–0.26 on homogeneous libraries — need to
    // detect whether the query is actually answerable before showing anything.
    scored.sort((a, b) => b.score - a.score);

    let top = [];
    const labeledResults  = scored.filter(r => !r._clipOnly);
    const clipOnlyResults = scored.filter(r =>  r._clipOnly);

    if (labeledResults.length > 0) {
      // Label mode: scores 0.05–0.85, clear gap between match/no-match
      const best = labeledResults[0].score;
      top = labeledResults
        .filter(r => r.score >= 0.15 && r.score >= best * 0.55)
        .slice(0, 30);

    } else {
      // CLIP-only mode: no labels, all scores in tight 0.19–0.26 band.
      // Can't gate on absolute threshold (best is always ~0.24 regardless of query).
      // Strategy: show top N by relative spread — photos meaningfully above the pack.
      // Use top-20 mean as baseline; show anything ≥ baseline + 0.5σ, max 12.
      if (clipOnlyResults.length > 0) {
        const allScores = clipOnlyResults.map(r => r.score);
        const mean = allScores.reduce((a, b) => a + b, 0) / allScores.length;
        const variance = allScores.reduce((s, x) => s + (x - mean) ** 2, 0) / allScores.length;
        const sigma = Math.sqrt(variance);
        const floor = mean + sigma * 0.5;  // top ~30% of distribution
        top = clipOnlyResults.filter(r => r.score >= floor).slice(0, 12);
        // If sigma is tiny (flat noise, σ < 0.003) → genuinely nothing to show
        if (sigma < 0.003) top = [];
      }
    }

    const ms = Math.round(performance.now() - t0);
    console.log('[Pixory]', JSON.stringify(query),
      '| hasLabels:', hasLabels, '| kws:', kws,
      '| top:', top.length,
      '| best:', scored.length ? (scored[0].score*100|0)+'%' : 'n/a',
      '|', ms+'ms');

    // Warn when operating in degraded CLIP-only mode
    if (!hasLabels && kws.length > 0 && top.length > 0) {
      const g = document.getElementById("results-grid");
      if (g) {
        const warn = document.createElement('div');
        warn.style.cssText = 'grid-column:1/-1;padding:8px 12px;background:#2d1f00;' +
          'border-radius:8px;font-size:11px;color:#f0a030;margin-bottom:6px;';
        warn.textContent = '⚠️ No semantic labels — re-index for accurate search.';
        g.prepend(warn);
      }
    }

    renderResults(top, query);
    if (statusBar) statusBar.textContent = top.length > 0
      ? `${top.length} results for "${query}" — ${ms}ms`
      : `No results for "${query}"`;

  } catch(err) {
    console.error('[Pixory] Search error:', err);
    if (grid) grid.innerHTML =
      `<div style="grid-column:1/-1;padding:24px;color:#FF453A">Search error: ${err.message}</div>`;
  }
}


function renderResults(results, query) {
  const g = document.getElementById("results-grid");
  if (!g) return;
  g.innerHTML = "";

  if ((cachedVecs||[]).length === 0) {
    g.innerHTML = `<div style="grid-column:1/-1;padding:32px;text-align:center;color:#98989D">
      No photos indexed.<br><br>Run <b>/sync</b> in Telegram to import your index.</div>`;
    return;
  }

  if (results.length === 0 && query) {
    const hasLabels = cachedLabels && cachedLabels.some(Boolean);
    const hint = hasLabels
      ? "Try different keywords, or browse all photos below."
      : "Re-index your photos to enable label-based search.";
    g.innerHTML = `
      <div style="grid-column:1/-1;padding:32px 16px;text-align:center">
        <div style="font-size:32px;margin-bottom:8px">🔍</div>
        <div style="color:#e0e0e0;font-size:16px;margin-bottom:6px">
          No results for "<b>${query}</b>"</div>
        <div style="color:#8E8E93;font-size:13px">${hint}</div>
      </div>`;
    if (statusBar) statusBar.textContent = `No results for "${query}"`;
    return;
  }

  if (statusBar) statusBar.textContent =
    results.length > 0 ? `${results.length} results for "${query}"` : "";
  results.forEach(r => g.appendChild(makeThumbnailItem(r)));
}

// ── Start ─────────────────────────────────────────────────────────────────────
if (location.protocol === 'file:') {
  document.getElementById('loading-msg').textContent =
    '⚠️ Open via http://localhost, not file://';
} else {
  init();
}
</script>
