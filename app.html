<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Pixory</title>

<!--
  Pixory 3.0 — Telegram Mini App
  SECURITY:
  - CLIP text encoder runs entirely in this WebView (ADR-01)
  - Search queries never leave the device
  - Vectors stored in IndexedDB, sandboxed to this origin
  - CSP blocks all outbound connections during search
  - SRI on Transformers.js (update hash on version bump)

  OPEN SOURCE: AGPL v3 — https://github.com/pixory/pixory3
-->

<!-- CSP disabled for MVP testing — re-enable before production -->

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--tg-theme-bg-color, #0d1117);
  color: var(--tg-theme-text-color, #e6edf3);
  min-height: 100vh;
}

/* ── States ── */
#state-loading, #state-import, #state-ready, #state-error {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  text-align: center;
  gap: 16px;
}
.active { display: flex !important; }

/* ── Loading ── */
.spinner {
  width: 40px; height: 40px;
  border: 3px solid #30363d;
  border-top-color: #58a6ff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: #8b949e; font-size: 14px; }

/* ── Import ── */
.import-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 14px;
  padding: 28px 24px;
  max-width: 340px;
  width: 100%;
}
.import-card h2 { font-size: 18px; margin-bottom: 8px; }
.import-card p  { color: #8b949e; font-size: 13px; line-height: 1.5; }
.import-steps   { text-align: left; margin: 16px 0; }
.import-steps li { color: #8b949e; font-size: 12px; margin: 6px 0 6px 16px; }
.btn-cancel {
  margin-top: 8px;
  background: none;
  border: 1px solid #30363d;
  color: #8b949e;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  width: 100%;
}
.btn-cancel:active { background: #21262d; }
.btn-primary {
  display: block; width: 100%;
  background: #238636; color: white;
  border: none; border-radius: 10px;
  padding: 14px; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 16px;
}
.btn-primary:hover { background: #2ea043; }
#file-input { display: none; }

/* ── Search ── */
#state-ready { justify-content: flex-start; padding: 0; align-items: stretch; }
.search-bar {
  position: sticky; top: 0; z-index: 10;
  background: var(--tg-theme-bg-color, #0d1117);
  padding: 12px 16px;
  border-bottom: 1px solid #21262d;
  display: flex; gap: 8px; align-items: center;
}
.search-input {
  flex: 1;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  color: #e6edf3;
  font-size: 15px;
  padding: 10px 14px;
  outline: none;
}
.search-input:focus { border-color: #58a6ff; }
.search-input::placeholder { color: #555; }
.status-bar {
  padding: 6px 16px;
  font-size: 11px;
  color: #555;
  min-height: 24px;
}
.results-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  padding: 0 0 72px;
  width: 100%;
}
.result-item {
  aspect-ratio: 1;
  background: #161b22;
  overflow: hidden;
  cursor: pointer;
  position: relative;
}
.result-item img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.result-item .score {
  position: absolute; bottom: 4px; right: 4px;
  background: rgba(0,0,0,0.6);
  color: white; font-size: 9px;
  padding: 2px 5px; border-radius: 4px;
}
.result-item .date {
  position: absolute; bottom: 4px; left: 4px;
  background: rgba(0,0,0,0.6);
  color: #ccc; font-size: 9px;
  padding: 2px 5px; border-radius: 4px;
}
.result-item .geo-tag {
  position: absolute; top: 4px; right: 4px;
  font-size: 13px; line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
}
.empty { color: #555; font-size: 14px; text-align: center; padding: 48px 16px; }
.import-btn-small {
  position: fixed; bottom: 90px; right: 16px;
  background: #21262d; color: #8b949e;
  border: 1px solid #30363d; border-radius: 20px;
  padding: 10px 16px; font-size: 13px; cursor: pointer;
  z-index: 100;
  -webkit-tap-highlight-color: rgba(255,255,255,0.1);
}

/* ── Tab bar ── */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 56px;
  background: #161b22;
  border-top: 1px solid #21262d;
  display: flex;
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: none; border: none;
  color: #555; cursor: pointer; gap: 2px;
  -webkit-tap-highlight-color: rgba(255,255,255,0.05);
}
.tab-btn.tab-active { color: #58a6ff; }
.tab-icon { font-size: 18px; line-height: 1; }
.tab-label { font-size: 10px; font-weight: 500; }

/* ── Top bars ── */
.top-bar {
  position: sticky; top: 0; z-index: 10;
  background: var(--tg-theme-bg-color, #0d1117);
  padding: 10px 16px 8px;
  border-bottom: 1px solid #21262d;
}
.top-bar-browse {
  display: flex; align-items: center; justify-content: space-between;
}
.browse-title { font-size: 17px; font-weight: 600; }
.photo-count  { font-size: 12px; color: #555; }

/* ── Geo chips ── */
.geo-chips {
  padding: 8px 16px;
  border-bottom: 1px solid #21262d;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.geo-chips::-webkit-scrollbar { display: none; }
.geo-chips-inner {
  display: flex; gap: 8px; width: max-content;
}
.geo-chip {
  display: flex; align-items: center; gap: 5px;
  background: #21262d; border: 1px solid #30363d;
  border-radius: 16px; padding: 5px 12px;
  font-size: 12px; cursor: pointer; white-space: nowrap;
  color: #8b949e;
  -webkit-tap-highlight-color: rgba(255,255,255,0.05);
  transition: background 0.1s;
}
.geo-chip.chip-active {
  background: #1f4a6e; border-color: #58a6ff; color: #58a6ff;
}
.chip-flag { font-size: 15px; }
.chip-count {
  background: #30363d; border-radius: 8px;
  padding: 1px 6px; font-size: 10px; color: #8b949e;
}

/* ── Results grid bottom padding (tab bar) ── */
.results-grid { padding-bottom: 72px; }
.status-bar   { padding-bottom: 2px; }
</style>
</head>
<body>

<!-- STATE: Loading model -->
<div id="state-loading" class="active">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-msg">Loading AI model…</div>
  <div style="color:#555;font-size:11px">First launch: ~65MB download, cached forever</div>
</div>

<!-- Lightbox overlay -->
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);
     z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px"
     onclick="this.style.display='none'">
  <img id="lightbox-img" style="max-width:95vw;max-height:80vh;border-radius:8px;object-fit:contain">
  <div id="lightbox-name" style="color:#8b949e;font-size:12px;max-width:90vw;
       text-align:center;word-break:break-all"></div>
</div>

<!-- STATE: Import vectors.bin -->
<div id="state-import">
  <div class="import-card">
    <h2>📁 Import your library</h2>
    <p>Your photo index was not found.<br>Generate it on your PC first.</p>
    <ol class="import-steps">
      <li>On PC: run <code>python indexer.py --photos /your/photos</code></li>
      <li>Copy <code>vectors.bin</code> to your phone</li>
      <li>Tap Import below</li>
    </ol>
    <input type="file" id="file-input" accept=".bin">
    <button class="btn-primary" onclick="document.getElementById('file-input').click()">
      📂 Select index file
    </button>
    <button id="btn-cancel-import" class="btn-cancel" style="display:none"
            onclick="setState('state-ready')">
      ← Back to search
    </button>
  </div>
</div>

<!-- STATE: Search + Browse (tab bar) -->
<div id="state-ready">

  <!-- Top bar: search input OR browse header -->
  <div class="top-bar" id="top-bar-search">
    <input class="search-input" id="search-input"
           type="search" placeholder="Search your photos…"
           autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="top-bar top-bar-browse" id="top-bar-browse" style="display:none">
    <span class="browse-title">All Photos</span>
    <span class="photo-count" id="browse-count"></span>
  </div>

  <!-- Geo filter chips (shown in both tabs) -->
  <div class="geo-chips" id="geo-chips" style="display:none">
    <div class="geo-chips-inner" id="geo-chips-inner"></div>
  </div>

  <!-- Status bar (search tab only) -->
  <div class="status-bar" id="status-bar"></div>

  <!-- Search results grid -->
  <div class="results-grid" id="results-grid"></div>

  <!-- Browse grid + virtual scroll sentinel -->
  <div class="results-grid" id="browse-grid" style="display:none"></div>
  <div id="browse-sentinel" style="height:1px;display:none"></div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <button class="tab-btn tab-active" id="tab-search" onclick="switchTab('search')">
      <span class="tab-icon">🔍</span>
      <span class="tab-label">Search</span>
    </button>
    <button class="tab-btn" id="tab-browse" onclick="switchTab('browse')">
      <span class="tab-icon">🗂</span>
      <span class="tab-label">Browse</span>
    </button>
    <button class="tab-btn" id="tab-reimport" onclick="showImport()">
      <span class="tab-icon">↻</span>
      <span class="tab-label">Import</span>
    </button>
  </div>

</div>

<!-- STATE: Error -->
<div id="state-error">
  <div style="font-size:40px">⚠️</div>
  <div id="error-msg" style="color:#e67e22;font-size:14px;max-width:280px"></div>
  <button class="btn-primary" style="max-width:200px" onclick="location.reload()">Retry</button>
</div>

<script>
// ── Security: verify Telegram WebApp initData ─────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  // initData verification: send to our stateless worker for true/false only
  // ADR-08: bot token never client-side — worker returns verified: bool
  // For v1 MVP: skip server-side verification, accept Telegram context
  // TODO: add /verify endpoint on Cloudflare Worker before production
}


// ── Encryption (AES-256-GCM + PBKDF2) ────────────────────────────────────────
const ENCRYPT_MAGIC = "PIXENC1";

function isEncrypted(buffer) {
  if (buffer.byteLength < 7) return false;
  const header = new TextDecoder().decode(new Uint8Array(buffer, 0, 7));
  return header === ENCRYPT_MAGIC;
}

async function decryptVectors(encryptedBuffer, passphrase) {
  // Format: PIXENC1(7) + salt(16) + nonce(12) + ciphertext+tag(var)
  if (encryptedBuffer.byteLength < 7 + 16 + 12 + 16) {
    throw new Error("File too short to be a valid encrypted shard");
  }

  const salt       = new Uint8Array(encryptedBuffer,  7, 16);
  const nonce      = new Uint8Array(encryptedBuffer, 23, 12);
  const ciphertext = new Uint8Array(encryptedBuffer, 35);

  // Derive AES-256 key from passphrase (PBKDF2-HMAC-SHA256, 200K iterations)
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    new TextEncoder().encode(passphrase),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 200_000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );

  // Decrypt — throws if passphrase wrong (GCM authentication failure)
  try {
    const plaintext = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: nonce },
      key,
      ciphertext
    );
    return plaintext;
  } catch {
    throw new Error("Wrong passphrase or corrupted file");
  }
}

// Show passphrase modal, return promise that resolves with passphrase
function askPassphrase(filename) {
  return new Promise((resolve, reject) => {
    // Create modal overlay
    const overlay = document.createElement("div");
    overlay.style.cssText = `
      position:fixed;inset:0;background:rgba(0,0,0,0.8);
      display:flex;align-items:center;justify-content:center;
      z-index:1000;padding:24px;
    `;

    overlay.innerHTML = `
      <div style="background:#161b22;border:1px solid #30363d;border-radius:16px;
                  padding:28px 24px;max-width:340px;width:100%;text-align:center;">
        <div style="font-size:28px;margin-bottom:12px;">🔒</div>
        <h3 style="margin-bottom:8px;font-size:17px;">Encrypted Index</h3>
        <p style="color:#8b949e;font-size:13px;margin-bottom:20px;line-height:1.5;">
          <strong>${filename}</strong> is encrypted.<br>
          Enter the passphrase you set when indexing.
        </p>
        <div style="background:#0d1117;border:1px solid #30363d;border-radius:8px;
                    padding:12px;margin-bottom:16px;text-align:left;">
          <div style="color:#e67e22;font-size:12px;margin-bottom:6px;">⚠️ Remember your passphrase</div>
          <div style="color:#8b949e;font-size:11px;line-height:1.5;">
            Without it you cannot import this index<br>on another device or after reinstall.
          </div>
        </div>
        <input id="pp-input" type="password" placeholder="Passphrase"
          style="width:100%;background:#0d1117;border:1px solid #30363d;
                 border-radius:8px;padding:12px;color:#e6edf3;font-size:15px;
                 outline:none;margin-bottom:8px;" />
        <div id="pp-error" style="color:#f85149;font-size:12px;
             min-height:16px;margin-bottom:8px;"></div>
        <button id="pp-ok" style="width:100%;background:#238636;color:white;
          border:none;border-radius:10px;padding:14px;font-size:15px;
          font-weight:600;cursor:pointer;margin-bottom:8px;">
          Unlock
        </button>
        <button id="pp-cancel" style="width:100%;background:transparent;
          color:#8b949e;border:1px solid #30363d;border-radius:10px;
          padding:10px;font-size:13px;cursor:pointer;">
          Cancel
        </button>
      </div>
    `;

    document.body.appendChild(overlay);

    const input  = overlay.querySelector("#pp-input");
    const errEl  = overlay.querySelector("#pp-error");
    const okBtn  = overlay.querySelector("#pp-ok");
    const cancel = overlay.querySelector("#pp-cancel");

    input.focus();

    function attempt() {
      const val = input.value.trim();
      if (!val) { errEl.textContent = "Enter passphrase"; return; }
      overlay.remove();
      resolve(val);
    }

    okBtn.addEventListener("click", attempt);
    cancel.addEventListener("click", () => {
      overlay.remove();
      reject(new Error("Cancelled"));
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") attempt();
      errEl.textContent = "";
    });

    // Allow retrying with error feedback (called from import flow)
    overlay._setError = msg => { errEl.textContent = msg; input.value = ""; input.focus(); };
  });
}

// ── IndexedDB ────────────────────────────────────────────────────────────────
const DB_NAME    = "pixory3";
const DB_VERSION = 3;
const STORE      = "vectors";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const store = db.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
          store.createIndex("path", "path", { unique: true });
        }
        if (!db.objectStoreNames.contains('settings'))
          db.createObjectStore('settings');
        if (!db.objectStoreNames.contains('shard_blob'))
          db.createObjectStore('shard_blob');
        if (!db.objectStoreNames.contains('thumb_offsets'))
          db.createObjectStore('thumb_offsets');
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function countVectors(db) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).count();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e => reject(e.target.error);
  });
}


// ── Serve token (for serve.py authenticated requests) ──────────────────────
async function getServeToken() {
  try {
    const tx    = db.transaction('settings', 'readonly');
    const store = tx.objectStore('settings');
    return await new Promise(r => {
      const req  = store.get('serve_token');
      req.onsuccess = () => r(req.result || '');
      req.onerror   = () => r('');
    });
  } catch { return ''; }
}

async function setServeToken(token) {
  try {
    const tx = db.transaction('settings', 'readwrite');
    tx.objectStore('settings').put(token.trim(), 'serve_token');
    await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
  } catch {}
}

// Build URL for serve.py with token (null if no token configured)
function serveUrl(relPath, token) {
  if (!token) return null;
  return `http://127.0.0.1:8765/${relPath}?token=${encodeURIComponent(token)}`;
}

let _serveToken = '';

async function loadServeToken() {
  _serveToken = await getServeToken();
}


// ── Lazy thumbnail loading (Idea 2+3: WebP + Blob lazy decode) ───────────────
// Shard file stored as raw Blob in IDB.
// At display time: slice Blob at offset → createObjectURL → display → revoke.
// Memory: only visible thumbnails ever decoded. No 100K array of data: URIs.

let _shardBlob = null;  // loaded once from IDB on startup

async function loadShardBlob() {
  try {
    const tx = db.transaction('shard_blob', 'readonly');
    const result = await new Promise(r => {
      const req = tx.objectStore('shard_blob').get('current');
      req.onsuccess = () => r(req.result || null);
      req.onerror   = () => r(null);
    });
    _shardBlob = result;
  } catch { _shardBlob = null; }
}

async function saveShardBlob(arrayBuffer) {
  const blob = new Blob([arrayBuffer]);
  const tx = db.transaction('shard_blob', 'readwrite');
  tx.objectStore('shard_blob').put(blob, 'current');
  await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
  _shardBlob = blob;
}

async function saveThumbOffsets(offsetMap) {
  const tx = db.transaction('thumb_offsets', 'readwrite');
  tx.objectStore('thumb_offsets').put(offsetMap, 'current');
  await new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
}

async function loadThumbOffsets() {
  try {
    const tx = db.transaction('thumb_offsets', 'readonly');
    return await new Promise(r => {
      const req = tx.objectStore('thumb_offsets').get('current');
      req.onsuccess = () => r(req.result || {});
      req.onerror   = () => r({});
    });
  } catch { return {}; }
}

let _thumbOffsets = {};  // path → {offset, len}

// Get thumbnail URL for a result — lazy decode from Blob
// Returns object URL (caller must revoke) or null
function getThumbUrl(result) {
  // Priority 1: embedded data URL (small archives, --thumbs without lazy)
  if (result.thumbDataUrl) return result.thumbDataUrl;

  // Priority 2: lazy decode from shard Blob
  if (_shardBlob && _thumbOffsets[result.path]) {
    const { offset, len } = _thumbOffsets[result.path];
    if (len > 0) {
      const slice = _shardBlob.slice(offset, offset + len);
      return URL.createObjectURL(slice);  // caller must revoke
    }
  }

  // Priority 3: serve.py (home WiFi, PC on)
  if (_serveToken) {
    const safe = result.path.replace(/[^a-zA-Z0-9._-]/g, '_').substring(0, 120);
    return serveUrl(`thumbs/${safe}.webp`, _serveToken)
        || serveUrl(`thumbs/${safe}.jpg`, _serveToken);
  }

  return null;
}

// Build offset table during import (one-time, fast)
function buildThumbOffsets(buffer) {
  const view    = new DataView(buffer);
  const magic   = String.fromCharCode(...new Uint8Array(buffer, 0, 4));
  if (magic !== 'PXRY') return {};
  const version = view.getUint8(4);
  if (version !== 3) return {};  // only v3 has thumbs

  const dim     = view.getUint16(5, true);  // actual dim: 512/768/1024
  const count   = view.getUint32(7, true);
  const offsets = {};
  let pos = 32;

  for (let i = 0; i < count; i++) {
    pos += dim;                         // Int8 vector (dim bytes, not hardcoded 512)
    const ts   = view.getUint32(pos, true); pos += 4;
    const cc   = view.getUint16(pos, true); pos += 2;
    const clen = view.getUint8(pos);        pos += 1;
    pos += clen;                            // city
    pos += 8;                               // phash (uint64)
    const plen = view.getUint16(pos, true); pos += 2;
    const path = new TextDecoder().decode(new Uint8Array(buffer, pos, plen));
    pos += plen;

    const tlen = view.getUint32(pos, true); pos += 4;
    if (tlen > 0) {
      offsets[path] = { offset: pos, len: tlen };
      pos += tlen;
    }
  }
  return offsets;
}

async function getAllVectors(db) {
  return new Promise((resolve, reject) => {
    const tx  = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e => reject(e.target.error);
  });
}

// appendToStore: ADD records without clearing existing ones
// Used for multi-shard import (each shard appends)
async function appendToStore(db, records) {
  return new Promise((resolve, reject) => {
    const tx    = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    let i = 0;
    function next() {
      if (i >= records.length) { resolve(); return; }
      const req = store.add(records[i++]);
      req.onsuccess = next;
      req.onerror   = e => reject(e.target.error);
    }
    next();
    tx.onerror = e => reject(e.target.error);
  });
}

// clearAndStore: REPLACE all records (used for full re-import)
async function clearAndStore(db, records) {
  return new Promise((resolve, reject) => {
    const tx    = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    store.clear().onsuccess = () => {
      let i = 0;
      function next() {
        if (i >= records.length) { resolve(); return; }
        const req = store.add(records[i++]);
        req.onsuccess = next;
        req.onerror   = e => reject(e.target.error);
      }
      next();
    };
    tx.onerror = e => reject(e.target.error);
  });
}

// ── vectors.bin parser ────────────────────────────────────────────────────────
function parseVectorsBin(buffer) {
  const view   = new DataView(buffer);
  const magic  = String.fromCharCode(...new Uint8Array(buffer, 0, 4));
  if (magic !== "PXRY") throw new Error("Invalid file: not a Pixory vectors.bin");

  const version = view.getUint8(4);
  const dim     = view.getUint16(5, true);
  const count   = view.getUint32(7, true);

  // dim: 512=ViT-B/32, 768=ViT-L/14, 1024=RN50

  // v3: Int8 quantized, shards with country/city/phash (32-byte header)
  if (version === 3) return _parseV3(buffer, view, dim, count);
  // v1/v2: float32 legacy format
  // v1/v2: float32 legacy format

  const records = [];
  let offset = 16; // header size
  const dec  = new TextDecoder("utf-8");

  for (let i = 0; i < count; i++) {
    // Vector: 512 × float32 = 2048 bytes
    // Use buffer.slice() to create aligned copy — Float32Array requires
    // offset to be a multiple of 4, which variable-length paths break.
    const slice  = buffer.slice(offset, offset + dim * 4);
    const vector = new Float32Array(slice);
    offset += dim * 4;

    // Timestamp: uint32
    const ts = view.getUint32(offset, true);
    offset += 4;

    // Path: uint16 length + bytes
    const plen = view.getUint16(offset, true);
    offset += 2;
    const path = dec.decode(new Uint8Array(buffer, offset, plen));
    offset += plen;

    // Thumbnail: uint32 length + JPEG bytes (0 = no thumbnail)
    const tlen = view.getUint32(offset, true);
    offset += 4;
    let thumbDataUrl = "";
    if (tlen > 0) {
      const jpegBytes = new Uint8Array(buffer, offset, tlen);
      // Convert JPEG bytes to base64 data URL
      let binary = "";
      for (let j = 0; j < jpegBytes.length; j++) {
        binary += String.fromCharCode(jpegBytes[j]);
      }
      thumbDataUrl = "data:image/jpeg;base64," + btoa(binary);
      offset += tlen;
    }

    records.push({
      vector: Array.from(vector),
      ts,
      path,
      date:         ts ? new Date(ts * 1000).toISOString().slice(0, 10) : "",
      thumbDataUrl,
    });
  }

  return { count, records };
}

// ── CLIP text encoder via Transformers.js ─────────────────────────────────────
// Loaded from CDN with SRI (update hash when upgrading version)
let clipTokenizer = null;
let clipTextModel  = null;


// ── v3 parser (Int8 quantized, shards) ──────────────────────────────────────
// Security: validates magic, version, dimension before parsing any data
// Unhappy paths: corrupt file → throws (caught by caller → shows error)
function _parseV3(buffer, view, dim, count) {
  // Header: 32 bytes total
  // [0:4] magic, [4] version, [5:7] dim, [7:11] count,
  // [11:13] year, [13] quant, [14:32] reserved
  const quant = view.getUint8(13);
  if (quant !== 1) throw new Error(`Unsupported quantization: ${quant}`);

  const records = [];
  let offset = 32; // skip 32-byte header

  for (let i = 0; i < count; i++) {
    if (offset + dim > buffer.byteLength)
      throw new Error(`Truncated file at record ${i}`);

    // Int8 vector (dim bytes) → dequantize to float32
    // dim is read from header (supports ViT-B/32=512, ViT-L/14=768, RN50=1024)
    const raw = new Int8Array(buffer, offset, dim);
    const vector = new Float32Array(dim);
    for (let j = 0; j < dim; j++) vector[j] = raw[j] / 127.0;
    offset += dim;

    // ts (uint32), cc (uint16), clen (uint8)
    const ts   = view.getUint32(offset, true);     offset += 4;
    const cc   = view.getUint16(offset, true);     offset += 2;
    const clen = view.getUint8(offset);            offset += 1;

    // city (UTF-8, clen bytes)
    const city = clen > 0
      ? new TextDecoder().decode(new Uint8Array(buffer, offset, clen))
      : "";
    offset += clen;

    // phash (uint64 as two uint32 — JS can't do BigInt64 in all contexts)
    const phLo = view.getUint32(offset, true);
    const phHi = view.getUint32(offset + 4, true);
    offset += 8;

    // path
    const plen = view.getUint16(offset, true);     offset += 2;
    const path = new TextDecoder().decode(new Uint8Array(buffer, offset, plen));
    offset += plen;

    // thumbnail
    const tlen = view.getUint32(offset, true);     offset += 4;
    let thumbDataUrl = "";
    if (tlen > 0) {
      const jpegBytes = new Uint8Array(buffer, offset, tlen);
      let bin = "";
      for (let k = 0; k < jpegBytes.length; k++) bin += String.fromCharCode(jpegBytes[k]);
      thumbDataUrl = "data:image/jpeg;base64," + btoa(bin);
      offset += tlen;
    }

    const name = path.split(/[\/]/).pop() || path;
    const date = ts ? new Date(ts * 1000).toISOString().slice(0, 10) : "";
    
    records.push({ vector, ts, path, date, name, cc, city, thumbDataUrl });
  }
  return records;
}

async function loadCLIP() {
  // Note: WKWebView (Telegram/iOS) can freeze DOM during WASM compilation.
  // We show a static message with clear expectation rather than a timer
  // that may appear frozen.
  setLoading(
    "Loading AI model…\n\n" +
    "⏳ First launch takes 30–90 seconds.\n" +
    "Screen may look frozen — this is normal.\n" +
    "Subsequent launches are instant (cached)."
  );

  try {
    const { AutoTokenizer, CLIPTextModelWithProjection } = await import(
      "https://cdn.jsdelivr.net/npm/@xenova/transformers@2/dist/transformers.min.js"
    );
    [clipTokenizer, clipTextModel] = await Promise.all([
      AutoTokenizer.from_pretrained("Xenova/clip-vit-large-patch14"),
      CLIPTextModelWithProjection.from_pretrained("Xenova/clip-vit-large-patch14"),
    ]);
    setLoading("AI model ready ✓");
  } catch (err) {
    throw new Error("Model load failed: " + err.message);
  }
}

async function textEmbed(query) {
  const inputs = clipTokenizer([query], { padding: true, truncation: true });
  const { text_embeds } = await clipTextModel(inputs);
  // L2-normalize to match open_clip image embeddings
  const vec  = text_embeds.data;
  const norm = Math.sqrt(Array.from(vec).reduce((s, v) => s + v * v, 0));
  return Float32Array.from(vec, v => v / norm);
}

const IS_LOCAL = location.hostname === '127.0.0.1' || location.hostname === 'localhost';


// ── Cosine similarity (batch, optimised) ─────────────────────────────────────
function cosineSimilarity(a, b) {
  // Both assumed L2-normalized (CLIP outputs are normalized)
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return dot;
}

const SCORE_CUTOFF = 0.18;  // L/14 scores are lower (0.15-0.28 range)

function topK(queryVec, vectors, paths, dates, k = 20) {
  const scores = vectors
    .map((v, i) => ({
      score:        cosineSimilarity(queryVec, v),
      path:         paths[i],
      date:         dates[i],
      thumbDataUrl: cachedThumbs ? cachedThumbs[i] : "",
      cc:           cachedCC     ? cachedCC[i]      : 0,
      i,
    }))
    .filter(r => r.score >= SCORE_CUTOFF &&
                 (_activeCC === 0 || r.cc === _activeCC));
  scores.sort((a, b) => b.score - a.score);
  return scores.slice(0, k);
}

async function loadVectorsFromDB() {
  const rows     = await getAllVectors(db);
  cachedVecs     = rows.map(r => new Float32Array(r.vector));
  cachedPaths    = rows.map(r => r.path);
  cachedDates    = rows.map(r => r.date || "");
  cachedThumbs   = rows.map(r => r.thumbDataUrl || "");
  cachedCC       = rows.map(r => r.cc || 0);
  // Compute mean vector for hubness reduction
  _computeMeanVec();
}

let _meanVec = null;

function _computeMeanVec() {
  if (!cachedVecs || cachedVecs.length === 0) { _meanVec = null; return; }
  const dim = cachedVecs[0].length;
  const mean = new Float32Array(dim);
  for (const v of cachedVecs) for (let i = 0; i < dim; i++) mean[i] += v[i];
  const n = cachedVecs.length;
  for (let i = 0; i < dim; i++) mean[i] /= n;
  // Normalize mean vector
  let norm = 0; for (let i = 0; i < dim; i++) norm += mean[i]*mean[i];
  norm = Math.sqrt(norm);
  if (norm > 0) for (let i = 0; i < dim; i++) mean[i] /= norm;
  _meanVec = mean;
}

function _dehubbify(vec) {
  // Subtract mean component to reduce hubness effect
  // Photos near the "center" of the embedding space stop dominating results
  if (!_meanVec) return vec;
  const dim = vec.length;
  const dot = vec.reduce((s, v, i) => s + v * _meanVec[i], 0);
  const out = new Float32Array(dim);
  let norm2 = 0;
  for (let i = 0; i < dim; i++) { out[i] = vec[i] - dot * _meanVec[i]; norm2 += out[i]*out[i]; }
  const norm = Math.sqrt(norm2);
  if (norm > 0) for (let i = 0; i < dim; i++) out[i] /= norm;
  return out;
}


// ── File import ───────────────────────────────────────────────────────────────
// Re-import handled by onclick="showImport()" on tab-reimport button

document.getElementById("file-input").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  setLoading("Reading file…");
  try {
    let buf = await file.arrayBuffer();

    // ── Encrypted shard: prompt for passphrase ────────────────────────────
    if (isEncrypted(buf)) {
      setLoading("Encrypted index detected…");
      let decrypted = null;
      while (!decrypted) {
        let passphrase;
        try {
          passphrase = await askPassphrase(file.name);
        } catch {
          // User cancelled
          setState("state-import");
          return;
        }
        setLoading("Decrypting… (this takes a few seconds)");
        try {
          decrypted = await decryptVectors(buf, passphrase);
        } catch (decErr) {
          // Wrong passphrase — show error inline in modal (re-prompt)
          // Since modal is gone, show error and re-ask
          setLoading("Wrong passphrase. Try again…");
          await new Promise(r => setTimeout(r, 800));
          // Loop continues → askPassphrase again
        }
      }
      buf = decrypted;
    }

    // ── Parse (v1/v2/v3) ─────────────────────────────────────────────────
    setLoading("Parsing index…");
    const records = parseVectorsBin(buf);
    const count   = records.length;

    // Idea 3: lazy thumbnail decode — save Blob + offset table
    const offsets = buildThumbOffsets(buf);
    const hasThumbs = Object.keys(offsets).length > 0;
    if (hasThumbs) {
      setLoading("Saving " + count + " vectors + thumbnail index…");
      await saveShardBlob(buf);
      await saveThumbOffsets(offsets);
      _thumbOffsets = offsets;
    }

    setLoading("Storing " + count + " vectors…");
    await clearAndStore(db, records);
    await loadVectorsFromDB();
    const total = cachedVecs ? cachedVecs.length : count;

    setState("state-ready");
    document.getElementById("status-bar").textContent =
      total + " photos indexed. Try \"sunset\" or \"birthday party\".";
  } catch (err) {
    showError("Import failed: " + err.message);
  }
});

// ── Geo filter state ───────────────────────────────────────────────────────────
let _activeCC = 0;   // 0 = all countries

function buildGeoIndex() {
  // {countryCode → count}
  const counts = {};
  if (!cachedVecs) return {};
  for (let i = 0; i < cachedPaths.length; i++) {
    const cc = cachedCC ? cachedCC[i] : 0;
    if (cc) counts[cc] = (counts[cc] || 0) + 1;
  }
  return counts;
}

function renderGeoChips() {
  const counts = buildGeoIndex();
  const chips  = document.getElementById('geo-chips-inner');
  const wrap   = document.getElementById('geo-chips');
  const entries = Object.entries(counts)
    .filter(([cc]) => cc > 0)
    .sort((a, b) => b[1] - a[1]);

  if (entries.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';

  chips.innerHTML = '';

  // "All" chip
  const all = document.createElement('div');
  all.className = 'geo-chip' + (_activeCC === 0 ? ' chip-active' : '');
  all.innerHTML = '<span class="chip-flag">🌍</span> All';
  all.onclick = () => setGeoFilter(0);
  chips.appendChild(all);

  for (const [cc, cnt] of entries) {
    const c   = parseInt(cc);
    const div = document.createElement('div');
    div.className = 'geo-chip' + (_activeCC === c ? ' chip-active' : '');
    div.innerHTML = `<span class="chip-flag">${CC_FLAG(c)}</span>
      ${CC_NAME(c)}
      <span class="chip-count">${cnt}</span>`;
    div.onclick = () => setGeoFilter(c);
    chips.appendChild(div);
  }
}

function setGeoFilter(cc) {
  _activeCC = cc;
  renderGeoChips();
  if (_currentTab === 'search') {
    const q = document.getElementById('search-input').value.trim();
    if (q) runSearch(q); else renderResults([], '');
  } else {
    startBrowse();
  }
}

function filteredIndices() {
  if (!cachedVecs) return [];
  if (_activeCC === 0) return cachedVecs.map((_, i) => i);
  return cachedVecs
    .map((_, i) => i)
    .filter(i => (cachedCC ? cachedCC[i] : 0) === _activeCC);
}

// ── Browse mode (virtual scroll) ──────────────────────────────────────────────
let _currentTab   = 'search';
let _browseItems  = [];    // all filtered indices sorted by date desc
let _browseOffset = 0;
const BROWSE_BATCH = 60;   // items per render batch
let _browseObserver = null;

function switchTab(tab) {
  _currentTab = tab;
  document.getElementById('tab-search').classList.toggle('tab-active', tab === 'search');
  document.getElementById('tab-browse').classList.toggle('tab-active', tab === 'browse');
  document.getElementById('top-bar-search').style.display = tab === 'search' ? '' : 'none';
  document.getElementById('top-bar-browse').style.display = tab === 'browse' ? '' : 'none';
  document.getElementById('results-grid').style.display   = tab === 'search' ? '' : 'none';
  document.getElementById('browse-grid').style.display    = tab === 'browse' ? '' : 'none';
  document.getElementById('status-bar').style.display     = tab === 'search' ? '' : 'none';
  if (tab === 'browse') startBrowse();
}

function startBrowse() {
  const indices = filteredIndices();
  // Sort by timestamp descending (newest first)
  _browseItems = indices.sort((a, b) => {
    const ta = cachedDates[a] || '';
    const tb = cachedDates[b] || '';
    return tb.localeCompare(ta);
  });
  _browseOffset = 0;
  document.getElementById('browse-grid').innerHTML = '';
  document.getElementById('browse-count').textContent =
    _browseItems.length + ' photos';

  // Disconnect old observer
  if (_browseObserver) _browseObserver.disconnect();

  renderBrowseBatch();

  // Sentinel: load more when bottom reached
  const sentinel = document.getElementById('browse-sentinel');
  sentinel.style.display = '';
  _browseObserver = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && _browseOffset < _browseItems.length) {
      renderBrowseBatch();
    }
  }, { rootMargin: '200px' });
  _browseObserver.observe(sentinel);
}

function renderBrowseBatch() {
  const grid  = document.getElementById('browse-grid');
  const batch = _browseItems.slice(_browseOffset, _browseOffset + BROWSE_BATCH);
  _browseOffset += batch.length;

  for (const idx of batch) {
    const item = makeThumbnailItem({
      path:         cachedPaths[idx],
      date:         cachedDates[idx],
      thumbDataUrl: cachedThumbs ? cachedThumbs[idx] : '',
      cc:           cachedCC    ? cachedCC[idx]      : 0,
      score:        null,        // no score in browse mode
    });
    grid.appendChild(item);
  }
}

// ── Shared thumbnail item factory ─────────────────────────────────────────────
function makeThumbnailItem(r) {
  const item = document.createElement('div');
  item.className = 'result-item';
  const name = r.path.split(/[/\\]/).pop();
  const url  = getThumbUrl(r);

  let inner = '';
  if (url) {
    const isBlob = url.startsWith('blob:');
    inner = `<img src="${url}"
      style="width:100%;height:100%;object-fit:cover;display:block;"
      loading="lazy"
      onload="if(this.src.startsWith('blob:'))URL.revokeObjectURL(this.src)"
      onerror="if(this.src.startsWith('blob:'))URL.revokeObjectURL(this.src);this.style.display='none'">`;
  } else {
    inner = `<div style="width:100%;height:100%;display:flex;align-items:center;
      justify-content:center;background:#161b22;flex-direction:column;gap:3px">
      <div style="font-size:22px">🖼</div>
      <div style="font-size:9px;color:#555;padding:2px 4px;text-align:center;
        word-break:break-all;line-height:1.3">${name}</div>
    </div>`;
  }

  const scoreTag = r.score !== null
    ? `<span class="score">${(r.score*100).toFixed(0)}%</span>` : '';
  const dateTag  = r.date
    ? `<span class="date">${r.date}</span>` : '';
  const geoTag   = r.cc
    ? `<span class="geo-tag">${CC_FLAG(r.cc)}</span>` : '';

  item.innerHTML = inner + scoreTag + dateTag + geoTag;

  item.addEventListener('click', () => {
    // If serve.py token available: try to open original
    if (_serveToken) {
      const originalUrl = serveUrl(name, _serveToken);
      if (tg) {
        tg.openLink(originalUrl);
      } else {
        window.open(originalUrl, '_blank');
      }
      return;
    }
    // Fallback: show info popup
    const info = [
      name,
      r.date || '',
      r.cc ? CC_FLAG(r.cc) + ' ' + CC_NAME(r.cc) : '',
      r.score !== null ? 'Score: ' + (r.score*100).toFixed(0) + '%' : ''
    ].filter(Boolean).join('\n');
    if (tg) tg.showPopup({ title: 'Photo info', message: info, buttons:[{type:'close'}] });
    else alert(info);
  });
  return item;
}

    const ms  = Math.round(performance.now() - t0);

      .sort((a, b) => b.s - a.s).slice(0, 5);
    console.log(`[Pixory] Top scores for "${query}":`,
      rawTop.map(r => `${(r.s*100).toFixed(1)}% ${r.p.split(/[\/]/).pop()}`));

    renderResults(top, query);
    statusBar.textContent =
      `${top.length} results for "${query}" — ${ms}ms`;
  } catch (err) {
    statusBar.textContent = `Search error: ${err.message}`;
  }
}

function renderResults(results, query) {
  grid.innerHTML = "";
  if (results.length === 0) {
    if (query) grid.innerHTML =
      `<div style="grid-column:1/-1;padding:40px 16px;text-align:center;color:#555">
         <div style="font-size:32px;margin-bottom:12px">🔍</div>
         <div style="font-size:14px">No matching photos for "<strong style="color:#8b949e">${query}</strong>"</div>
         <div style="font-size:12px;margin-top:8px">Try a different description</div>
       </div>`;
    return;
  }
  results.forEach(r => grid.appendChild(makeThumbnailItem(r)));
}

// ── Start ─────────────────────────────────────────────────────────────────────

// Detect file:// protocol — fetch won't work, show clear instruction
if (location.protocol === 'file:') {
  document.getElementById('loading-msg').textContent =
    '⚠️ Open via http://localhost, not file://';
  document.querySelector('.loading-text + div').innerHTML =
    '<div style="color:#e67e22;font-size:13px;max-width:280px;line-height:1.6">' +
    'In terminal:<br><code style="background:#21262d;padding:4px 8px;border-radius:4px">' +
    'python -m http.server 8765</code><br><br>' +
    'Then open:<br><code style="background:#21262d;padding:4px 8px;border-radius:4px">' +
    'http://localhost:8765/app.html</code></div>';
} else {
  init();
}
</script>
