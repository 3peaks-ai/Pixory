<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fetch Test</title>
<style>
body { background:#111; color:#fff; font-family:monospace;
       padding:16px; margin:0; font-size:13px; }
button { background:#0A84FF; color:#fff; border:none; border-radius:10px;
         padding:12px 24px; font-size:15px; width:100%; margin:8px 0; }
.ok  { color:#30D158; }
.err { color:#FF453A; }
.inf { color:#8E8E93; }
</style>
</head>
<body>
<button onclick="runTest()">▶ Start Test</button>
<div id="log"></div>
<script>
const BASE = "https://pub-d8a218c4d660421f80ca496a2dd69f5f.r2.dev/";
const log  = document.getElementById("log");

function add(msg, cls) {
  const d = document.createElement("div");
  d.className = cls||""; d.textContent = msg;
  log.appendChild(d);
}

async function testFile(name) {
  add("→ " + name, "inf");
  try {
    const r = await fetch(BASE + name);
    if (!r.ok) { add("  ❌ HTTP " + r.status, "err"); return false; }
    const buf = await r.arrayBuffer();
    add("  ✅ " + (buf.byteLength/1e6).toFixed(1) + " MB OK", "ok");
    return true;
  } catch(e) {
    add("  ❌ " + e.message, "err"); return false;
  }
}

async function runTest() {
  log.innerHTML = "";
  for (const mb of [70, 100, 120]) {
    const ok = await testFile("test_" + mb + "mb.bin");
    if (!ok) { add("⛔ Limit below " + mb + "MB", "err"); return; }
  }
  add("🎉 All passed!", "ok");
}
</script>
</body>
</html>
